<!DOCTYPE html>
<html lang="pt-BR" data-font="m" data-modo="claro" data-paleta="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0066b3">
<meta name="description" content="ACS Digital — Aplicativo de apoio ao Agente Comunitário de Saúde. Funciona offline.">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ACS Digital">
<link rel="icon" type="image/png" sizes="512x512" href="icons/512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/192.png">
<link rel="icon" type="image/png" sizes="144x144" href="icons/144.png">
<link rel="icon" type="image/png" sizes="96x96" href="icons/96.png">
<link rel="icon" type="image/png" sizes="72x72" href="icons/72.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/48.png">
<link rel="icon" type="image/png" sizes="36x36" href="icons/36.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="ACS Digital">
<link rel="apple-touch-icon" sizes="180x180" href="icons/192.png">
<title>ACS Digital</title>
<style>
/* ============================================================
   ACS Digital — identidade visual: cores do SUS (azul #0066B3,
   verde #00995D, amarelo #FFCC29) + tons institucionais da
   Prefeitura de Jundiaí (azul, vermelho, branco).
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --azul:#0066b3; --azul-esc:#004e8c; --azul-claro:#e3eef7;
  --verde:#00995d; --verde-btn:#00814f; --amarelo:#ffcc29; --vermelho:#c8102e;
  --bg:#eef4f9; --card:#ffffff; --ink:#17303f; --ink-soft:#54707f; --line:#d7e3ec;
  --top:#0066b3; --top-ink:#ffffff; --top-ink-soft:#cfe3f2;
  --chip:#e3eef7; --chip-ink:#0b4d80;
  --ok:#d9f2e4; --ok-ink:#116640; --warn:#fdf3d0; --warn-ink:#7a5c00;
  --danger:#f6d9de; --danger-ink:#8f1128; --sel:#cfead9; --sel-ink:#0d5c38;
  --sel-azul:#d7e9f9; --sel-azul-ink:#3a7cb8;
  --yellow-soft:#fff6d9; --yellow-ink:#7a5c00;
  --radius:14px;
  --shadow:0 1px 3px rgba(10,40,60,.14),0 4px 14px rgba(10,40,60,.08);
}
html[data-font="p"]{font-size:14px}
html[data-font="m"]{font-size:16px}
html[data-font="g"]{font-size:18.5px}
html[data-paleta="1"]{--bg:#eaf6ee;--chip:#dff0e6;--chip-ink:#0e5a38;--line:#d0e6d9;--azul-claro:#e2f1ea}
html[data-paleta="2"]{--bg:#faf3ea;--chip:#f3e7d9;--chip-ink:#7a4a12;--line:#eadfd0;--azul-claro:#f4ece1}
html[data-paleta="3"]{--bg:#f4effb;--chip:#eae1f7;--chip-ink:#55308d;--line:#e2d8f2;--azul-claro:#efe9f9}
html[data-paleta="4"]{--bg:#fdf8e3;--chip:#f7edc6;--chip-ink:#6b5200;--line:#f0e5c0;--azul-claro:#f9f2d8}
html[data-paleta="5"]{--bg:#fdeef4;--chip:#fadfea;--chip-ink:#8f2d5e;--line:#f3d8e6;--azul-claro:#fae9f1}
/* OBS: as paletas vêm ANTES do bloco escuro de propósito — assim o modo escuro
   (mesma especificidade, declarado depois) sempre vence e segue legível. */
html[data-modo="escuro"]{
  --bg:#0f171d; --card:#182430; --ink:#e8f0f6; --ink-soft:#93a9b8; --line:#28394a;
  --top:#0d2c44; --top-ink:#eaf4fc; --top-ink-soft:#9dbed8;
  --azul:#1179c9; --azul-claro:#1b2f40;
  --chip:#1d2f3f; --chip-ink:#a8cbe6;
  --ok:#123a28; --ok-ink:#8fe0b4; --warn:#3c3110; --warn-ink:#f0d47a;
  --danger:#451620; --danger-ink:#f2a9b6; --sel:#1d4534; --sel-ink:#9fe2c0;
  --sel-azul:#1d3652; --sel-azul-ink:#6fa3d8;
  --yellow-soft:#3c3110; --yellow-ink:#f0d47a;
  --shadow:0 1px 3px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.35);
}
html,body{height:100%}
html{background:var(--bg)}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',Roboto,Arial,sans-serif;
  background:transparent; color:var(--ink); min-height:100dvh;
  overscroll-behavior-y:none;
}
/* Tipografia (fontes nativas do Android) — sobrepõem a família padrão do body */
html[data-tipo="serif"] body{font-family:'Noto Serif',Georgia,'Times New Roman',serif}
html[data-tipo="mono"] body{font-family:'Droid Sans Mono','Cutive Mono','Courier New',monospace}
/* Papel de parede: camada fixa atrás de todo o conteúdo (html fica com a cor) */
#wp-layer{position:fixed;inset:0;z-index:-1;background-repeat:no-repeat;background-position:center;background-size:auto 100%;pointer-events:none}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
::placeholder{color:var(--ink-soft);opacity:1}
/* ---------- Topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;gap:.5rem;align-items:center;justify-content:space-between;
  background:var(--top);color:var(--top-ink);
  padding:calc(.5rem + env(safe-area-inset-top)) .6rem calc(.5rem + env(safe-area-inset-bottom));
  box-shadow:0 2px 6px rgba(0,0,0,.18);
}
.tb-side{display:flex;gap:.4rem;align-items:center;min-width:86px}
.tb-side.right{justify-content:flex-end}
.tb-title{flex:1;text-align:center;font-weight:700;font-size:1.02rem;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;font-weight:500;font-size:.68rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Subtítulo longo (ex.: tela do menu): permite quebrar em 2 linhas com contraste pleno */
.tb-title small.wrap{opacity:1;color:var(--top-ink-soft);white-space:normal;line-height:1.3;font-size:.66rem}
.btn-tb{
  display:inline-flex;align-items:center;gap:.3rem;border:1px solid rgba(255,255,255,.35);border-radius:10px;
  background:rgba(255,255,255,.12);color:var(--top-ink);padding:.45rem .7rem;font-size:.85rem;font-weight:700;
  cursor:pointer;min-height:42px;letter-spacing:.02em;
}
.btn-tb:disabled{opacity:.4;cursor:not-allowed}
.btn-tb:not(:disabled):active{transform:scale(.97)}
/* ---------- Conteúdo ---------- */
.content{max-width:720px;margin:0 auto;padding:1rem .8rem calc(2rem + env(safe-area-inset-bottom))}
.center{text-align:center}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
.tiny{font-size:.72rem}
.spacer{height:1rem}
.mt{margin-top:.75rem}.mb{margin-bottom:.75rem}
hr.sep{border:0;border-top:1px solid var(--line);margin:1rem 0}
/* ---------- Botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;padding:.6rem .95rem;font-size:.95rem;font-weight:600;cursor:pointer;
  min-height:46px;user-select:none;transition:transform .05s,filter .15s;text-align:center;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--azul);border-color:var(--azul);color:#fff}
/* Verde de botão mais escuro que o --verde decorativo: branco atinge 4,9:1 (AA).
   O --verde (#00995d) continua em bordas/detalhes, onde o mínimo é 3:1. */
.btn-g{background:var(--verde-btn);border-color:var(--verde-btn);color:#fff}
.btn-r{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.btn-y{background:var(--amarelo);border-color:var(--amarelo);color:#4a3800}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-block{display:flex;width:100%}
.btn-sm{min-height:38px;padding:.35rem .65rem;font-size:.85rem;border-radius:10px}
.btn-big{font-size:1.15rem;min-height:64px;border-radius:16px}
/* ---------- Menu principal ---------- */
.menu-grid{display:flex;flex-direction:column;gap:.8rem;max-width:460px;margin:1.2rem auto 0}
.menu-btn{
  display:flex;align-items:center;gap:.9rem;justify-content:flex-start;text-align:left;
  background:var(--card);border:1px solid var(--line);border-left:6px solid var(--azul);
  border-radius:16px;padding:1.1rem 1.1rem;font-size:1.12rem;font-weight:700;color:var(--ink);
  cursor:pointer;box-shadow:var(--shadow);min-height:64px;
}
.menu-btn:active{transform:scale(.985)}
.menu-btn .ic{font-size:1.5rem;line-height:1}
.menu-btn small{display:block;font-weight:500;font-size:.75rem;color:var(--ink-soft)}
.menu-btn.b-verde{border-left-color:var(--verde)}
.menu-btn.b-amarelo{border-left-color:var(--amarelo)}
.menu-btn.b-vermelho{border-left-color:var(--vermelho)}
.badge-avisos{
  display:flex;align-items:center;justify-content:center;gap:.4rem;margin:1.1rem auto 0;max-width:460px;
  background:var(--yellow-soft);color:var(--yellow-ink);border:1px solid var(--amarelo);
  padding:.55rem .9rem;border-radius:999px;font-weight:700;font-size:.95rem;
}
/* ---------- Cartões ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem;box-shadow:var(--shadow)}
.card+.card{margin-top:.6rem}
.card-title{font-weight:700;margin-bottom:.5rem}
/* ---------- Lista de moradores ---------- */
.row-list{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
.p-row{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;cursor:pointer;
  display:flex;flex-direction:column;gap:.15rem;
}
.p-row:active{transform:scale(.99)}
.p-row .p-nome{font-weight:700;font-size:.98rem}
.p-row .p-sub{font-size:.82rem;color:var(--ink-soft)}
.p-row .p-badges{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.25rem}
.p-row.selected{background:var(--sel);border-color:var(--sel-ink)}
.p-row.visit-ok{background:var(--ok);border-color:var(--ok-ink)}
.p-row.visit-nao{background:var(--warn);border-color:var(--warn-ink)}
.p-row.check-green{background:var(--ok);border-color:var(--ok-ink)}
.badge{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:.1rem .5rem;font-size:.68rem;font-weight:700;white-space:nowrap}
.badge.imp{background:var(--azul-claro);color:var(--chip-ink)}
/* ---------- Busca / inputs ---------- */
.search-box{position:relative;display:flex;align-items:center}
.search-box input{
  width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;
  padding:.65rem 2.4rem .65rem .8rem;min-height:48px;
}
.search-box input:focus{outline:2px solid var(--azul);border-color:var(--azul)}
.search-box .clear-x{
  position:absolute;right:.45rem;border:0;background:transparent;font-size:1.15rem;cursor:pointer;
  color:var(--ink-soft);padding:.3rem;line-height:1;
}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:.6rem .8rem;min-height:46px}
.inp:focus{outline:2px solid var(--azul);border-color:var(--azul)}
label.fld{display:block;margin-top:.7rem;font-weight:600;font-size:.85rem}
label.fld .req{color:var(--vermelho)}
.hist-line{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.hist-chip{
  background:var(--chip);color:var(--chip-ink);border:0;border-radius:999px;padding:.35rem .7rem;
  font-size:.8rem;font-weight:600;cursor:pointer;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* ---------- Organizadores ---------- */
.sort-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.sort-btn{
  flex:1;min-width:64px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;
  padding:.45rem .3rem;font-size:1.05rem;cursor:pointer;min-height:46px;color:var(--ink);
}
.sort-btn.active{background:var(--azul);border-color:var(--azul);color:#fff}
/* ---------- Chips de filtro ---------- */
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.chip-t{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:.4rem .8rem;font-size:.82rem;font-weight:600;cursor:pointer;
}
.chip-t.on{background:var(--azul);border-color:var(--azul);color:#fff}
/* NENHUM FILTRO: chip de limpeza — tracejado quando inativo, cheio quando ativo */
.chip-t.limpar{border-style:dashed;color:var(--ink-soft)}
.chip-t.limpar.on{background:var(--ink);border-color:var(--ink);color:var(--bg);border-style:solid}
/* ---------- Seletor ---------- */
.sel-wrap{position:relative;margin-top:.4rem}
.sel-wrap select{width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:.65rem 2rem .65rem .8rem;min-height:48px;font-weight:600}
.sel-wrap::after{content:"▾";position:absolute;right:.9rem;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-soft)}
/* ---------- Banner / Toast ---------- */
#banner{
  position:fixed;top:0;left:0;right:0;z-index:100;display:none;justify-content:center;padding:.5rem;
}
#banner.show{display:flex}
#banner .b-in{
  background:var(--amarelo);color:#4a3800;font-weight:700;font-size:.9rem;border-radius:12px;
  padding:.7rem 1rem;max-width:560px;box-shadow:0 4px 16px rgba(0,0,0,.25);text-align:center;
}
#toast{
  position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:600;font-size:.88rem;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Loading (processamento pesado: CSV, área, salvamentos) ---------- */
#loading-root{position:fixed;inset:0;z-index:130;display:none;background:rgba(5,20,32,.45)}
#loading-root.open{display:flex;align-items:center;justify-content:center}
#loading-root .ld-box{background:var(--card);color:var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:1.1rem 1.4rem;display:flex;flex-direction:column;align-items:center;gap:.65rem;max-width:82vw;text-align:center}
.ld-spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--azul-claro);border-top-color:var(--azul);animation:ldspin .8s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
#loading-root .ld-msg{font-weight:700;font-size:.92rem;line-height:1.35}
#loading-root .ld-sub{font-size:.78rem;color:var(--ink-soft);font-weight:600;word-break:break-word}
/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;z-index:80;display:none}
#modal-root.open{display:block}
#modal-root .overlay{position:absolute;inset:0;background:rgba(5,20,32,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal-root .modal{
  background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding:.8rem .8rem calc(1.2rem + env(safe-area-inset-bottom));
  box-shadow:0 -6px 30px rgba(0,0,0,.3);animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:640px){
  #modal-root .overlay{align-items:center;padding:1rem}
  #modal-root .modal{border-radius:18px}
}
/* Modais de busca (DEFINIR ÁREA, APLICAR/EDITAR filtros): ancorados no TOPO em
   telas estreitas para não ficarem atrás do teclado virtual do celular */
#modal-root .overlay.alto{align-items:flex-start;padding-top:calc(.55rem + env(safe-area-inset-top))}
#modal-root .overlay.alto .modal{max-height:calc(100dvh - env(safe-area-inset-top) - .9rem)}
@media (min-width:640px){
  #modal-root .overlay.alto{align-items:center;padding-top:1rem}
}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem;position:sticky;top:0;background:var(--bg);padding:.15rem 0;z-index:2}
.m-title{font-weight:800;font-size:1rem;text-align:center;flex:1}
/* Botões DENTRO de modais: nunca herdam o branco da topbar — o modal tem fundo
   claro (var(--bg)) e texto branco ficaria ilegível (WCAG AA exige 4.5:1) */
#modal-root .btn-tb{background:var(--card);border:1px solid var(--line);color:var(--ink)}
#modal-root .btn-tb:not(:disabled):active{transform:scale(.97)}
/* ---------- Senha ---------- */
.senha-wrap{max-width:430px;margin:2.2rem auto 0;padding:0 .8rem;text-align:center}
.senha-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:1.2rem}
.senha-btn{
  border:2px solid var(--line);background:var(--card);border-radius:16px;font-size:1.7rem;font-weight:800;
  letter-spacing:.35em;padding:1.2rem .4rem 1.2rem .75rem;cursor:pointer;color:var(--ink);min-height:96px;
}
.senha-btn.flash{animation:flash .3s}
@keyframes flash{0%{background:var(--azul-claro)}50%{background:var(--azul);color:#fff}100%{background:var(--card)}}
.senha-mini{display:flex;gap:.7rem;justify-content:center;margin-top:1.2rem}
/* ---------- Cartões de área ---------- */
.area-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem;margin-top:.55rem}
.area-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.area-head .a-nome{font-weight:700}
.area-head .del-x{border:0;background:transparent;font-size:1.05rem;cursor:pointer;color:var(--vermelho);padding:.2rem .4rem}
.area-nums{display:flex;gap:.5rem;margin-top:.55rem}
.area-nums .inp{min-height:42px}
.check-line{display:flex;gap:1.2rem;margin-top:.5rem;flex-wrap:wrap}
.check-line label{display:flex;align-items:center;gap:.35rem;font-size:.88rem;font-weight:600;cursor:pointer}
.check-line input{width:1.15rem;height:1.15rem;accent-color:var(--azul)}
/* ---------- Modal resultados (área) ---------- */
.res-list{display:flex;flex-direction:column;gap:.4rem;margin-top:.5rem}
.res-item{display:flex;gap:.55rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .65rem;cursor:pointer}
.res-item input{width:1.15rem;height:1.15rem;accent-color:var(--azul)}
.res-item.on{background:var(--sel);border-color:var(--sel-ink)}
/* ---------- Formulários ---------- */
.radio-line{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.4rem}
.radio-line label{display:flex;align-items:center;gap:.35rem;font-size:.92rem;font-weight:600;cursor:pointer}
.radio-line input{width:1.1rem;height:1.1rem;accent-color:var(--azul)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:380px){.two-col{grid-template-columns:1fr}}
.form-grid{display:flex;flex-direction:column}
/* ---------- Avisos ---------- */
.avisos-list{display:flex;flex-direction:column;gap:.55rem;margin-top:.7rem}
.av-card{border-left:5px solid var(--amarelo)}
.av-card .av-t{font-weight:700;font-size:.95rem}
.av-card .av-x{font-size:.88rem;color:var(--ink-soft);margin-top:.2rem}
.av-card .av-actions{margin-top:.55rem;display:flex;gap:.5rem;flex-wrap:wrap}
.av-card.av-done{opacity:.72}
/* ---------- Info perfil ---------- */
.info-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem;font-size:.95rem;line-height:1.55}
.info-box .i-line{padding:.28rem 0;border-bottom:1px dashed var(--line);word-break:break-word}
.info-box .i-line:last-child{border-bottom:0}
.info-box .i-lab{color:var(--ink-soft);font-size:.8rem;display:block}
.wa-btn{border:1.5px solid var(--verde);background:var(--ok);color:var(--ok-ink);border-radius:10px;padding:.25rem .55rem;cursor:pointer;font-size:.85rem;margin-left:.4rem}
.obs-area{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;padding:.6rem .7rem;background:var(--card);resize:vertical}
/* ---------- Tabela guias ---------- */
.g-row{display:flex;gap:.5rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;margin-top:.5rem}
.g-row.sel{background:var(--sel);border-color:var(--sel-ink)}
.g-row input[type=checkbox]{width:1.15rem;height:1.15rem;margin-top:.2rem;accent-color:var(--azul)}
.g-body{flex:1;min-width:0}
.g-body .g-nome{font-weight:700;font-size:.95rem}
.g-body .g-l{font-size:.82rem;color:var(--ink-soft)}
.st-tag{display:inline-block;border-radius:6px;padding:.05rem .4rem;font-size:.7rem;font-weight:800;margin-left:.3rem}
.st-comigo{background:var(--azul-claro);color:var(--chip-ink)}
.st-entregue{background:var(--ok);color:var(--ok-ink)}
.st-avisado{background:var(--warn);color:var(--warn-ink)}
/* ---------- Botão flutuante imprimir ---------- */
.print-bar{position:sticky;bottom:calc(.6rem + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;margin-top:.8rem;z-index:5}
/* ---------- Tema ---------- */
.seg{display:flex;gap:.4rem;margin-top:.4rem}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:.6rem .4rem;font-weight:700;cursor:pointer;color:var(--ink);min-height:46px}
.seg button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.pal-row{display:flex;gap:.6rem;margin-top:.5rem;flex-wrap:wrap}
.pal{flex:1 1 calc(33.33% - .45rem);min-width:96px;border:2px solid var(--line);border-radius:12px;padding:.5rem;cursor:pointer;text-align:center;font-weight:700;font-size:.8rem;color:var(--ink)}
.pal.on{border-color:var(--azul);outline:2px solid var(--azul)}
.pal .sw{height:34px;border-radius:8px;margin-bottom:.4rem}
/* ---------- Tela cheia inicial ---------- */
.full-center{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:1.2rem}
.logo-row{display:flex;flex-direction:column;align-items:center;gap:.5rem;margin-bottom:1.6rem}
.logo-img{width:74px;height:74px;border-radius:20px;box-shadow:var(--shadow);background:#fff;object-fit:cover;display:block}
.logo-mark{
  width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,var(--azul) 0%,var(--verde) 100%);
  display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;font-weight:800;
  box-shadow:var(--shadow);
}
.app-name{font-size:1.5rem;font-weight:800;color:var(--ink)}
.app-sub{font-size:.85rem;color:var(--ink-soft);text-align:center}
.recent-names{display:flex;flex-direction:column;gap:.45rem;margin-top:1rem}
.recent-names button{
  border:1.5px dashed var(--line);background:var(--card);border-radius:12px;padding:.65rem;font-weight:600;
  color:var(--ink);cursor:pointer;font-size:.95rem;min-height:46px;
}
/* ---------- Linhas com botões de ação (👤/🏡) ---------- */
.p-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.45rem}
.row-btns{display:flex;gap:.3rem;flex-shrink:0}
.mini-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  min-width:42px;min-height:38px;font-size:1.05rem;line-height:1;cursor:pointer;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
}
.mini-btn:active{transform:scale(.94)}
/* ---------- VISITA DOMICILIAR: seleção em azul pastel ---------- */
.p-row.sel-azul{background:var(--sel-azul);border-color:var(--sel-azul-ink)}
/* ---------- Recolher/expandir filtros (MORADORES) ---------- */
.filt-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.8rem}
.filt-toggle{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  min-width:46px;min-height:38px;font-size:1.05rem;cursor:pointer;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;
}
.filt-toggle:active{transform:scale(.94)}
/* ---------- RESIDÊNCIAS: endereço expansível ---------- */
.res-exp{border-top:1px dashed var(--line);margin-top:.45rem;padding-top:.3rem;display:flex;flex-direction:column;gap:.15rem}
.res-mor{display:flex;align-items:center;gap:.55rem;padding:.3rem .15rem;border-radius:8px}
.res-mor .rm-nome{flex:1;min-width:0;font-weight:600;font-size:.9rem;word-break:break-word}
.res-mor .rm-cad{font-size:.75rem;color:var(--ink-soft);white-space:nowrap}
.res-seta{font-size:.8rem;color:var(--ink-soft);margin-left:.4rem;flex-shrink:0}
/* ---------- MÉTRICAS ---------- */
.met-row{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .75rem;margin-top:.5rem}
.met-row .m-ic{font-size:1.35rem;flex-shrink:0}
.met-row .m-txt{flex:1;min-width:0;font-weight:600;font-size:.93rem;line-height:1.4}
.met-row .m-txt b{font-size:1.02rem}
.met-row .m-txt small{display:block;font-weight:500;color:var(--ink-soft);font-size:.75rem}
/* ---------- TEMA: papel de parede ---------- */
.wp-row{display:flex;gap:.55rem;margin-top:.55rem;flex-wrap:wrap}
.wp-opt{
  flex:1 1 calc(33.33% - .4rem);min-width:92px;height:108px;border:2px solid var(--line);border-radius:12px;
  background-size:cover;background-position:center;cursor:pointer;padding:0;
}
.wp-opt.on{border-color:var(--azul);outline:2px solid var(--azul)}
.wp-opt.wp-none{
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;
  color:var(--ink-soft);background:var(--card);border-style:dashed;
}
.wp-frame{
  width:86px;height:108px;border:2px dashed var(--line);border-radius:12px;background-size:cover;
  background-position:center;background-color:var(--card);cursor:pointer;flex-shrink:0;padding:0;
}
.wp-frame.on{border-style:solid;border-color:var(--azul);outline:2px solid var(--azul)}
/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- Morador com filtro vencido (atualização ACS Digital) ---------- */
.p-row.exp-filtro{background:#FFEEBC !important;border-color:#e0b900}
html[data-modo="escuro"] .p-row.exp-filtro{background:#3a2f04 !important;border-color:#5a4a00}
.p-row .row-btns-vert{display:flex;flex-direction:column;gap:.25rem;flex-shrink:0}

/* ---------- Ícone de calendário no perfil ---------- */
.cal-icon-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:10px;min-width:38px;min-height:38px;font-size:1.05rem;line-height:1;
  cursor:pointer;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  margin-left:auto;
}
.cal-icon-btn:active{transform:scale(.94)}
.mae-linha{display:flex;align-items:center;gap:.4rem}
.mae-linha .mae-val{flex:1}

/* ---------- Calendário ---------- */
.cal-toolbar{display:grid;grid-template-columns:1fr auto 1fr;gap:.4rem;margin:.6rem 0 .8rem}
.cal-toolbar .btn{padding:.55rem .8rem;font-size:.92rem}
.cal-day{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;
  margin-bottom:.45rem;display:flex;flex-direction:column;gap:.3rem;
}
.cal-day .cal-data{display:flex;gap:.5rem;align-items:baseline;font-size:1rem;border-bottom:1px dashed var(--line);padding-bottom:.3rem}
.cal-day .cal-data .cal-dia{font-size:1.35rem;font-weight:700;color:var(--azul);min-width:2.2rem}
.cal-day .cal-data .cal-mes{font-size:.95rem;color:var(--ink-soft)}
.cal-day .cal-evento{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;padding:.18rem 0}
.cal-day .cal-evento .mini-btn{font-size:.95rem;padding:.18rem .45rem;min-width:auto;min-height:auto}
.cal-day .cal-evento .cal-nome-bolo{font-weight:600;font-size:.9rem}
.cal-empty{padding:1.4rem .8rem;text-align:center;color:var(--ink-soft)}

/* ---------- Visita domiciliar: ícones de status ---------- */
.visit-icons{display:inline-flex;align-items:center;gap:.15rem;margin-left:auto;flex-shrink:0;font-size:1.05rem;line-height:1}
.visit-icons .vi{display:inline-flex;align-items:center;justify-content:center;min-width:24px;min-height:24px}
.visit-icons .vi-book{order:1}
.visit-icons .vi-visit{order:2}

/* ---------- Botões linha de visita (largura igual, gap, centralizado) ---------- */
.visit-row{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.45rem}
.visit-row .btn{padding:.55rem .6rem;text-align:center;font-size:.92rem;min-height:42px;display:flex;align-items:center;justify-content:center}
.visit-row-3{display:grid;grid-template-columns:1.6fr .9fr;gap:.5rem;margin-bottom:.45rem}
.visit-row-3 .btn{text-align:center;padding:.55rem .6rem;min-height:42px;display:flex;align-items:center;justify-content:center}

/* ---------- Banner de atualização PWA ---------- */
#banner .b-in.update-banner{background:var(--azul);color:#fff}
#banner .b-in.update-banner button{margin-left:.6rem;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:.25rem .55rem;font-weight:700;cursor:pointer;font-size:.85rem}

/* ---------- Modal centralizado por padrão (corrigir modais CONFERIR) ---------- */
@media (max-width:639px){
  #modal-root .overlay{align-items:center;padding:1rem}
  #modal-root .modal{border-radius:18px;max-height:90dvh;animation:up .18s ease-out}
}
/* Modal add/edit guias/agendamentos/visitas no topo (não atrás do teclado virtual) */
#modal-root .overlay.alto{align-items:flex-start !important;padding-top:calc(.55rem + env(safe-area-inset-top))}
#modal-root .overlay.alto .modal{max-height:calc(100dvh - env(safe-area-inset-top) - .9rem);border-radius:18px}
@media (min-width:640px){
  #modal-root .overlay.alto{align-items:center !important}
}

/* ---------- Exportar modal ---------- */
.exp-modal{padding:.4rem .1rem .8rem}
.exp-modal .exp-item{
  display:flex;align-items:center;gap:.55rem;padding:.55rem .8rem;
  border:1px solid var(--line);border-radius:10px;margin-bottom:.4rem;background:var(--card);cursor:pointer;
}
.exp-modal .exp-item input{width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:var(--azul)}
.exp-modal .exp-item .lbl{font-weight:600;font-size:.95rem;flex:1}
.exp-modal .exp-actions{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.6rem}
</style>
</head>
<body>
<div id="wp-layer" aria-hidden="true"></div>
<div id="banner"><div class="b-in" id="banner-in"></div></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="loading-root" role="alert" aria-live="assertive"><div class="ld-box"><div class="ld-spin" aria-hidden="true"></div><div class="ld-msg" id="ld-msg">Processando…</div><div class="ld-sub" id="ld-sub"></div></div></div>

<script>
'use strict';
/* ================================================================
   ACS Digital — aplicativo single-file (PWA-ready / Vite+Capacitor)
   Armazenamento local: IndexedDB (10–30 MB suportados nativamente)
   ================================================================ */

/* ---------------- Utilitários ---------------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
/* Sanitização de texto digitado/importado (defesa em profundidade — a exibição
   também escapa com esc()): remove tags, caracteres de controle e limita tamanho. */
function sanitizarTexto(s, maxLen){
  s = String(s ?? '')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, '')
    .replace(/[<>]/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  if(maxLen && s.length > maxLen) s = s.slice(0, maxLen);
  return s;
}
function yieldUI(){ return new Promise(r => requestAnimationFrame(() => setTimeout(r, 0))); }

/* ---------------- Loading (processamento pesado) ---------------- */
function showLoading(msg, sub){
  const r = $('#loading-root');
  const m = $('#ld-msg'), s = $('#ld-sub');
  if(m) m.textContent = msg || 'Processando…';
  if(s) s.textContent = sub || '';
  r.classList.add('open');
}
function setLoadingMsg(msg, sub){
  if(msg != null){ const m = $('#ld-msg'); if(m) m.textContent = msg; }
  if(sub != null){ const s = $('#ld-sub'); if(s) s.textContent = sub; }
}
function hideLoading(){ const r = $('#loading-root'); if(r) r.classList.remove('open'); }

    threshold:.38, ignoreLocation:true, minMatchCharLength:2 });
  _fuseCache = { ver: RES_VER, n: rs.length, inst };
  return inst;
}
function buscarFuse(rs, q){
  try{ return getFuse(rs).search(q).map(x => x.item); }
  catch(e){ return rs.filter(r => fuzzy(r.nome, q) || fuzzy(r.endereco, q)); } // fallback
}

function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,a), ms); }; }
function fuzzy(hay, q){ // subsequência simples, ignorando acentos/caixa (apenas letras)
  hay = norm(hay); q = norm(q); if(!q) return true;
  let i = 0;
  for(const c of hay){ if(c === q[i]) i++; if(i >= q.length) return true; }
  return i >= q.length;
}

/* ---------------- Datas ---------------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDateCell(v){
  v = String(v ?? '').trim(); if(!v) return '';
  let m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let d = +m[1], mo = +m[2], y = +m[3];
    if(y < 100) y += y < 70 ? 2000 : 1900;
    if(mo > 12 && d <= 12){ const t=d; d=mo; mo=t; } // fallback mm/dd
    if(mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    const dt = new Date(Date.UTC(y, mo-1, d));
    if(dt.getUTCFullYear()===y && dt.getUTCMonth()===mo-1 && dt.getUTCDate()===d)
      return y+'-'+pad2(mo)+'-'+pad2(d);
    return '';
  }
  m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){
    const y=+m[1], mo=+m[2], d=+m[3];
    if(mo<1||mo>12||d<1||d>31) return '';
    return y+'-'+pad2(mo)+'-'+pad2(d);
  }
  return '';
}
function fmtDate(iso){ if(!iso) return ''; const p = iso.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function idadeEm(nascISO, refISO){
  if(!nascISO) return null;
  const n = nascISO.split('-').map(Number), r = (refISO || todayISO()).split('-').map(Number);
  let a = r[0]-n[0];
  if(r[1] < n[1] || (r[1] === n[1] && r[2] < n[2])) a--;
  return a < 0 ? null : a;
}

function diffDias(isoA, isoB){ // isoA - isoB em dias
  const a = new Date(isoA+'T00:00:00Z'), b = new Date(isoB+'T00:00:00Z');
  return Math.round((a-b)/86400000);
}
function addMeses(iso, m){
  const p = iso.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1]-1+m, 1));
  const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(Math.min(p[2], last));
}
function trimestreNum(d){ d = d || new Date(); return Math.floor(d.getMonth()/3)+1; }
function trimestreStr(d){ d = d || new Date(); return pad2(trimestreNum(d))+'/'+d.getFullYear(); }
function fimTrimestreISO(d){
  d = d || new Date();
  const lastMonth = [2,5,8,11][trimestreNum(d)-1];
  const y = d.getFullYear();
  const last = new Date(Date.UTC(y, lastMonth+1, 0));

function aniversarioNoDia(nascISO, refISO){
  if(!nascISO) return false;
  const p = nascISO.split('-'), r = (refISO||todayISO()).split('-');
  return p[1] === r[1] && p[2] === r[2];

function diasParaAniversario(nascISO, refISO){
  if(!nascISO) return null;
  const p = nascISO.split('-').map(Number);
  const ref = refISO || todayISO();
  const r = ref.split('-').map(Number);
  const mk = y => new Date(Date.UTC(y, p[1]-1, p[2]));
  let alvo = mk(r[0]);

  if(alvo < hoje) alvo = mk(r[0]+1);
  return Math.round((alvo-hoje)/86400000);
}

/* ---------------- Hash e senha sazonal ---------------- */
function hashStr(s){
  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const SENHA_ALFABETO = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789';
function senhaSazonal(nome, triStr){
  const rng = mulberry32(hashStr(String(nome||'').trim().toUpperCase() + '|' + triStr));
  let s = '';
  for(let i=0;i<4;i++) s += SENHA_ALFABETO[Math.floor(rng()*SENHA_ALFABETO.length)];
  return s;
}
function senhaValida(s){ return /^[A-Z1-9]{4}$/.test(s||''); }

/* ---------------- IndexedDB ---------------- */
const DB_NAME = 'acs-digital', DB_VER = 2;
const ACS_APP_VERSION = '1.1.0'; // Versão do PWA (para checagem de atualização)
let _db = null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      const mk = (name, opt) => { if(!db.objectStoreNames.contains(name)) db.createObjectStore(name, opt); };
      mk('kv', {keyPath:'k'});
      mk('residents', {keyPath:'id', autoIncrement:true});
      mk('area', {keyPath:'id', autoIncrement:true});
      mk('filterDefs', {keyPath:'nome'});
      mk('guides', {keyPath:'id', autoIncrement:true});
      mk('appointments', {keyPath:'id', autoIncrement:true});
      // Novos stores (v2):
      mk('tags', {keyPath:'id', autoIncrement:true});        // etiquetas locais (filtros aplicados a moradores) — sobrevivem a re-importação
      mk('visits', {keyPath:'id', autoIncrement:true});      // visitas domiciliares independentes — sobrevivem a re-importação
      // Índices em residents para re-aplicar etiquetas/visitas por IDs únicos
      if(!db.objectStoreNames.contains('residents')){
        const os = db.createObjectStore('residents', {keyPath:'id', autoIncrement:true});
        try{ os.createIndex('cadastro','cadastro',{unique:false}); }catch(e){}
        try{ os.createIndex('cpf','cpf',{unique:false}); }catch(e){}
        try{ os.createIndex('cns','cns',{unique:false}); }catch(e){}
      } else {
        const os = e.target.transaction.objectStore('residents');
        try{ if(!os.indexNames.contains('cadastro')) os.createIndex('cadastro','cadastro',{unique:false}); }catch(e){}
        try{ if(!os.indexNames.contains('cpf')) os.createIndex('cpf','cpf',{unique:false}); }catch(e){}
        try{ if(!os.indexNames.contains('cns')) os.createIndex('cns','cns',{unique:false}); }catch(e){}
      }
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function idbReq(store, mode, fn){
  return idb().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  }));
}
const idbGet  = (st, k)    => idbReq(st,'readonly',  o => o.get(k)).then(r => r);
const idbAll  = (st)       => idbReq(st,'readonly',  o => o.getAll()).then(r => r || []);
const idbPut  = (st, v)    => idbReq(st,'readwrite', o => o.put(v));
const idbDel  = (st, k)    => idbReq(st,'readwrite', o => o.delete(k));
const idbClr  = (st)       => idbReq(st,'readwrite', o => o.clear());

/* ---------------- Utilitários de data/hora (input manual) ----------------
   Regras (especificação do usuário):
   - Data: 6 dígitos (ddmmaa) → dd/mm/20aa | 8 dígitos (ddmmaaaa) → dd/mm/aaaa
     Sempre século 21; datas inválidas são apagadas ao perder foco.
   - Hora: dígitos; se >2 dígitos, insere 'h' após os 2 primeiros. */
function fmtDataInput(s){
  if(!s) return '';
  const d = String(s).replace(/\D/g,'');
  if(d.length === 6 || d.length === 8){
    const dd = d.substr(0,2), mm = d.substr(2,2);
    const aa = d.length === 6 ? '20'+d.substr(4,2) : d.substr(4,4);
    // valida
    const dia = parseInt(dd,10), mes = parseInt(mm,10), ano = parseInt(aa,10);
    if(mes < 1 || mes > 12) return null;
    if(dia < 1 || dia > 31) return null;
    // dias por mês
    const bis = (ano%4===0 && (ano%100!==0 || ano%400===0));
    const dm = [31, bis?29:28, 31,30,31,30,31,31,30,31,30,31];
    if(dia > dm[mes-1]) return null;
    // ano mínimo razoável (século 21 + sanity)
    if(ano < 1900 || ano > 2199) return null;
    return dd+'/'+mm+'/'+aa;
  }
  // enquanto digita: mostra dd/mm/aaaa...
  if(d.length < 6) return d;
  return null;
}
function fmtDataInputParcial(s){
  // usado no input event: formata progressivo dd/mm/aaaa
  let d = String(s||'').replace(/\D/g,'').substr(0,8);
  if(d.length <= 2) return d;
  if(d.length <= 4) return d.substr(0,2)+'/'+d.substr(2);
  if(d.length <= 6) return d.substr(0,2)+'/'+d.substr(2,2)+'/'+d.substr(4,2);
  return d.substr(0,2)+'/'+d.substr(2,2)+'/'+d.substr(4); // 7 ou 8 dígitos: ano com 4
}
function fmtHoraInput(s){
  // usado no input event: mostra 'h' após 2 dígitos se houver mais
  let d = String(s||'').replace(/\D/g,'').substr(0,4);
  if(d.length <= 2) return d;
  return d.substr(0,2)+'h'+d.substr(2);
}
function fmtHoraInputFinal(s){
  // usado no blur: se 4 dígitos, monta '##h##'. Se menos, mantém como está.
  let d = String(s||'').replace(/\D/g,'').substr(0,4);
  if(d.length === 0) return '';
  if(d.length <= 2) return d;
  return d.substr(0,2)+'h'+d.substr(2);
}
function aplicarDataInput(el){
  if(!el) return;
  el.setAttribute('inputmode','numeric');
  el.setAttribute('pattern','[0-9/]*');
  el.setAttribute('placeholder','dd/mm/aaaa');
  el.addEventListener('input', () => { el.value = fmtDataInputParcial(el.value); });
  el.addEventListener('blur', () => {
    const v = el.value;
    if(!v){ return; }
    const out = fmtDataInput(v);
    if(out === null){ el.value = ''; toast('Data inválida — campo limpo'); }
    else el.value = out;
  });
  // retornar ISO ao salvar
  return el;
}
function aplicarHoraInput(el){
  if(!el) return;
  el.setAttribute('inputmode','numeric');
  el.setAttribute('pattern','[0-9h]*');
  el.setAttribute('placeholder','00h00');
  el.addEventListener('input', () => { el.value = fmtHoraInput(el.value); });
  el.addEventListener('blur', () => { el.value = fmtHoraInputFinal(el.value); });
  return el;
}
function dataBRtoISO(s){
  // dd/mm/aaaa → aaaa-mm-dd (para armazenar)
  const m = String(s||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(!m) return '';
  return m[3]+'-'+m[2]+'-'+m[1];
}
function dataISOtoBR(s){
  // aaaa-mm-dd → dd/mm/aaaa
  if(!s) return '';
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s;
  return m[3]+'/'+m[2]+'/'+m[1];
}

let bannerTimer = null;
function banner(msg, ms){
  const b = $('#banner'), bi = $('#banner-in');
  bi.textContent = msg; b.classList.add('show');
  const fechar = () => { b.classList.remove('show'); clearTimeout(bannerTimer); cleanup(); };
  let startY = null;
  const onDown = e => { startY = (e.touches ? e.touches[0].clientY : e.clientY); };
  const onUp = e => {
    if(startY != null){
      const y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      if(startY - y > 25){ fechar(); return; } // empurrado para cima
    }
    if(e.target === b || e.target === bi || bi.contains(e.target)) fechar(); // clique
  };
  function cleanup(){
    b.removeEventListener('pointerdown', onDown);
    b.removeEventListener('pointerup', onUp);
  }
  b.addEventListener('pointerdown', onDown);
  b.addEventListener('pointerup', onUp);
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(fechar, ms || 5000);
}

    // Reaproveita a caixa aberta: sem re-animar (evita "piscar" e perda de foco)
    const m = root.querySelector('.modal');
    if(m) m.innerHTML = html;
    const ov = root.querySelector('.overlay');
    if(ov) ov.classList.toggle('alto', !!opts.alto);
  } else {
    root.innerHTML = '<div class="overlay'+(opts.alto ? ' alto' : '')+'"><div class="modal">' + html + '</div></div>';
    root.classList.add('open');
  }
  if(guardou){
    const sel = '#modal-root #' + (window.CSS && CSS.escape ? CSS.escape(guardou.id) : guardou.id);
    const alvo = root.querySelector(sel);
    if(alvo){
      try{
        alvo.focus({preventScroll:true});

      }catch(err){}
    }
  }

}

/* ---------------- CSV ---------------- */
function detectDelim(text){
  const linha = text.split(/\r?\n/).find(l => l.trim()) || '';
  let inQ = false, sc=0, cm=0, tb=0;
  for(const ch of linha){
    if(ch === '"') inQ = !inQ;
    else if(!inQ){ if(ch === ';') sc++; else if(ch === ',') cm++; else if(ch === '\t') tb++; }
  }
  const mx = Math.max(sc, cm, tb);
  if(mx === 0) return ',';
  return mx === sc ? ';' : (mx === cm ? ',' : '\t');
}
async function parseCSV(text){
  text = String(text ?? '').replace(/^\uFEFF/, '');
  const delim = detectDelim(text);
  const rows = []; let row = [], field = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === delim){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* ignora */ }
      else field += c;
    }
    // Arquivos grandes (30 mil+ linhas): devolve o controle à UI periodicamente
    // para o spinner continuar girando e a tela não congelar.
    if((i & 0x3FFFF) === 0x3FFFF){
      setLoadingMsg(null, rows.length.toLocaleString('pt-BR') + ' linhas lidas…');
      await yieldUI();
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

    'h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:18px 0 6px}' +
    '.sub{color:#555;font-size:12px;margin-bottom:14px}' +
    'table{width:100%;border-collapse:collapse;font-size:12px}' +
    'td,th{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}' +
    'th{background:#e3eef7}.empty{color:#777;font-size:12px}';
  const html = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>' + esc(titulo) + '</title>' +
    '<style>' + css + '</style></head><body>' +
    '<h1>' + esc(titulo) + '</h1>' +
    '<div class="sub">ACS Digital — ' + esc(S.nome || '') + ' — ' + fmtDate(todayISO()) + '</div>' +
    corpoHTML + '</body></html>';
  const w = window.open('', '_blank');
  if(w){ w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(), 350); }
  else {
    const f = document.createElement('iframe');
    f.style.position='fixed'; f.style.right='0'; f.style.bottom='0'; f.style.width='0'; f.style.height='0'; f.style.border='0';
    document.body.appendChild(f);
    f.srcdoc = html;
    f.onload = () => { try{ f.contentWindow.print(); }catch(e){} setTimeout(()=>f.remove(), 4000); };
  }
}
async function copiarTexto(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copiado para a área de transferência'); }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('Copiado para a área de transferência'); }
    catch(e2){ toast('Não foi possível copiar'); }
    ta.remove();
  }
}
/* ---------------- Navegação ---------------- */
const stack = [];
let menuLiberado = false;
let currentRender = null;
const SCREENS = {};
function registerScreen(name, fn){ SCREENS[name] = fn; }
function render(scr, params){
  currentRender = {scr, params: params || {}};
  closeModal();
  const fn = SCREENS[scr];
  const app = $('#app');
  app.innerHTML = '';
  if(fn) fn(app, params || {});
  window.scrollTo(0, 0);
}
function go(scr, params){
  stack.push({scr, params: params || {}});
  render(scr, params || {});
  try{ history.pushState({i: stack.length - 1}, ''); }catch(e){}
}
function resetStack(scr, params, escudo){
  stack.length = 0;
  stack.push({scr, params: params || {}});
  render(scr, params || {});
  try{
    history.replaceState({i: 0}, '');
    if(escudo) history.pushState({i: 0, shield: true}, ''); // escudo só no boot
  }catch(e){}
}
window.addEventListener('popstate', (e) => {
  const cur = stack[stack.length - 1];
  if(!cur) return;
  const st = e.state || {};
  // TELA DO MENU liberada: botão voltar do aparelho não retorna a nome/senha.
  const bloqueado = (cur.scr === 'nome') || (cur.scr === 'senha') ||
                    (cur.scr === 'menu' && menuLiberado) || stack.length <= 1;
  if(st.shield || bloqueado){
    // Escudo no meio do histórico: se a tela atual NÃO for bloqueada, executa o
    // voltar de verdade (antes o usuário ficava preso após o primeiro retorno).
    if(!bloqueado){
      stack.pop();
      const t = stack[stack.length - 1];
      render(t.scr, t.params);
    }
    try{ history.pushState({i: stack.length - 1, shield: stack.length <= 1}, ''); }catch(err){}
    return;
  }
  if(typeof st.i === 'number' && st.i >= 0 && st.i < stack.length - 1){
    stack.length = st.i + 1;
  } else {
    stack.pop();
  }
  const t = stack[stack.length - 1];
  render(t.scr, t.params);
  if(stack.length === 1){
    try{ history.pushState({i: 0, shield: true}, ''); }catch(err){} // re-escudo na raiz
  }
});
function navBack(){
  // Navegação direta pelo stack interno — NÃO depende de history.back(),
  // que trava em file:// ("'file:' URLs are treated as unique security origins")
  // e após consumir o escudo de histórico (bug: voltar funcionava só uma vez).
  if(stack.length <= 1){
    // segurança extra: nunca deixa o usuário preso fora do menu
    if(menuLiberado && currentRender && currentRender.scr !== 'menu') resetStack('menu');
    return;
  }
  stack.pop();
  const t = stack[stack.length - 1];
  render(t.scr, t.params);
  try{ history.replaceState({i: stack.length - 1}, ''); }catch(e){}
}

/* ---------------- Busca de moradores (regras próprias) ---------------- */
const RUA_WORDS = ['rua','avenida','estrada','alameda','viela','praca','travessa'];
/* Tipos de logradouro que deixam de ser importados/exibidos (rua, avenida, estrada…) */
const TIPO_LOGR = ['rua','r','avenida','av','aven','estrada','est','travessa','tv','alameda','al','praca','praça','pca','beco','viela','rodovia','rod','via','caminho'];
function stripTipoLogradouro(s){
  let out = String(s ?? '').trim();
  for(let g = 0; g < 3; g++){
    const t = out.split(/\s+/);
    if(t.length > 1 && TIPO_LOGR.includes(norm(t[0]).replace(/\.$/,''))) out = t.slice(1).join(' ');
    else break;
  }
  return out.trim();
}
/* Número da casa canonizado: zeros à esquerda ignorados — 08 e 8 são a mesma residência.
   Números com letras (ex.: "12A") não são alterados. */
function numCasa(v){
  const s = String(v ?? '').trim();
  const m = s.match(/^0*(\d+)$/);
  if(m) return String(parseInt(m[1], 10));
  return s.toLowerCase();
}
/* Número como é exibido: sem zeros à esquerda quando é só dígitos ("0285"→"285") */
function numeroExibicao(v){
  const s = String(v ?? '').trim();
  const m = s.match(/^0+(\d+)$/);
  return m ? m[1] : s;
}
/* Chave única da residência = logradouro sem tipo + número canonizado */
function chaveRes(r){ return norm(stripTipoLogradouro(r.endereco||'')) + '|' + numCasa(r.numero); }
function letras(s){ return norm(s).replace(/[^a-z]/g,'').length; }
function comecaComRua(s){ const t = norm(s).split(/\s+/); return t.length && RUA_WORDS.includes(t[0]); }
function interpretarBusca(q){
  let raw = String(q || '').trim();
  if(!raw) return {tipo:'vazio'};
  // Endereços não guardam mais o tipo de logradouro: “rua dario” passa a buscar “dario”
  const t0 = raw.split(/\s+/);
  if(t0.length > 1 && TIPO_LOGR.includes(norm(t0[0]).replace(/\.$/,''))) raw = t0.slice(1).join(' ').trim();
  const nq = norm(raw);
  if(/^(\d{2})\/(\d{2})\/(\d{4})$/.test(raw)) return {tipo:'data', iso: parseDateCell(raw)};
  if(nq.includes('aniversariante')) return {tipo:'aniversario'};
  const mm = nq.match(/^m[ae]e\s+(.+)$/);
  if(mm){
    const rest = mm[1].trim();
    return letras(rest) >= 3 ? {tipo:'mae', q: rest} : {tipo:'nenhum'};
  }
  if(/^\d+$/.test(raw)) return raw.length >= 4 ? {tipo:'numero', n: raw} : {tipo:'nenhum'};
  const mn = raw.match(/^(.+?)\s+(\d+)$/);
  if(mn && !(/^\d+$/.test(mn[1]))){
    if(letras(mn[1]) >= 3 || comecaComRua(mn[1])) return {tipo:'enderecoNumero', rua: mn[1], num: mn[2]};
    return {tipo:'nenhum'};
  }
  const toks = nq.split(/\s+/);
  if(RUA_WORDS.includes(toks[0])){
    const rest = toks.slice(1).join(' ').trim();
    if(!rest) return {tipo:'nenhum'}; // nome de rua sozinho não ativa a busca
    return {tipo:'endereco', q: rest};
  }
  if(letras(raw) >= 3) return {tipo:'geral', q: raw};
  return {tipo:'nenhum'};
}
function buscarMoradores(rs, it){
  switch(it.tipo){
    case 'data': return rs.filter(r => r.nascimento && r.nascimento === it.iso);
    case 'aniversario': return rs.filter(r => aniversarioNoDia(r.nascimento));
    case 'mae': return rs.filter(r => fuzzy(r.mae, it.q));
    case 'numero': return rs.filter(r =>
        onlyDigits(r.cns).includes(it.n) || onlyDigits(r.cpf).includes(it.n) ||
        onlyDigits(r.cadastro).includes(it.n) || onlyDigits(r.telRes).includes(it.n) ||
        onlyDigits(r.telCel).includes(it.n) || onlyDigits(r.telRec).includes(it.n));
    case 'enderecoNumero': return rs.filter(r => fuzzy(r.endereco, it.rua) && numCasa(r.numero) === numCasa(it.num));
    case 'endereco': return buscarFuse(rs, it.q);
    case 'geral': return buscarFuse(rs, it.q);
    default: return [];
  }
}
const TXT_BUSCA_NENHUM = 'Digite ao menos 3 letras do nome ou endereço. Ex.: "mãe ana", "dario 3080", "05/03/1978", "aniversariante" ou 4+ números (CNS, CPF, cadastro, telefone).';

/* ---------------- Ordenação de moradores ---------------- */
function numDe(v){ const n = parseInt(String(v).replace(/\D/g,''),10); return isNaN(n) ? Infinity : n; }
function ordenarMoradores(arr, org){
  const byNum = (sinal) => (a,b) => {
    const na = numDe(a.numero), nb = numDe(b.numero);
    if(na === nb) return 0;
    if(na === Infinity) return 1;
    if(nb === Infinity) return -1;
    return sinal * (na - nb);
  };
  const byEnd = (sinal) => (a,b) => sinal * String(a.endereco||'').localeCompare(String(b.endereco||''), 'pt-BR');
  const byNasc = (sinal) => (a,b) => {
    if(!a.nascimento && !b.nascimento) return 0;
    if(!a.nascimento) return 1;
    if(!b.nascimento) return -1;
    return sinal * a.nascimento.localeCompare(b.nascimento);
  };
  const byNome = (sinal) => (a,b) => sinal * String(a.nome||'').localeCompare(String(b.nome||''), 'pt-BR');
  const fns = {
    'e0': [byEnd(-1),  byNum(-1)],   // ⬆️⬆️ endereço e número decrescentes
    'e1': [byEnd(1),   byNum(1)],    // ⬇️⬇️ endereço e número crescentes (padrão)
    'e2': [byEnd(1),   byNum(-1)],   // ⬇️⬆️ endereço crescente, número decrescente
    'e3': [byEnd(-1),  byNum(1)],    // ⬆️⬇️ endereço decrescente, número crescente
    'i0': [byNasc(-1)],              // 👶👴 mais novo → mais velho
    'i1': [byNasc(1)],               // 👴👶 mais velho → mais novo
    'a0': [byNome(1)],               // ⬇️🔠 A-Z
    'a1': [byNome(-1)]               // ⬆️🔠 Z-A
  };
  return arr.sort((a,b) => { for(const f of fns[org]){ const r = f(a,b); if(r) return r; } return 0; });
}

/* ---------------- Moradores: helpers ---------------- */
/* Endereço exibido: logradouro SEM tipo + número — nada além disso
   (complemento e bairro deixam de ser importados e de aparecer) */
function linhaEndereco(r){
  const e = stripTipoLogradouro(r.endereco||'');
  const n = numeroExibicao(r.numero);
  const s = e ? (n ? e + ', ' + n : e) : n;
  return s || '(sem endereço)';
}

function filtrosDoMorador(r){
  const list = (r.filtros||[]).map(f => f.nome);

  if(i != null && i < 2 && !list.some(n => norm(n) === 'puericultura')) list.push('PUERICULTURA');

function filtrosBadges(r, max){
  const fs = filtrosDoMorador(r);
  if(!fs.length) return '';

  const vis = fs.slice(0, max).map(f => '<span class="badge imp">'+esc(f)+'</span>').join('');
  return '<span class="p-badges">' + vis + (fs.length > max ? '<span class="badge">+'+(fs.length-max)+'</span>' : '') + '</span>';
}
/* Verifica se um morador tem filtro com validade vencida (periodicidade de visita estourada).
   Regra (update2.txt): "todos moradores com filtro estão com a data vencida assim que
   inseridos no programa". Ao registrar visita retroativa, deixa de estar vencido. Volta a
   vencer quando (hoje - última_visita) > periodicidade (em meses). */
function moradorTemFiltroVencido(r){
  if(!r || !r.filtros || !r.filtros.length) return false;
  const hoje = todayISO();
  const visitas = (r.visitas||[]).map(v => v.data).filter(Boolean).sort();
  const ultima = visitas.length ? visitas[visitas.length-1] : null;
  for(const f of r.filtros){
    const def = (typeof filterDefsCache !== 'undefined' && filterDefsCache) ? filterDefsCache.find(d => norm(d.nome) === norm(f.nome)) : null;
    const per = (def && def.periodicidade) || f.periodicidade || 6; // padrão 6 meses
    if(per && per > 0){
      if(!ultima){
        // Sem visita: vencido assim que inserido
        return true;
      }
      const base = ultima;
      const prazo = addMeses(base, per);
      if(diffDias(prazo, hoje) < 0) return true;
    }
    if(f.validade){
      // validade direta (data fixa)
      if(diffDias(f.validade, hoje) < 0) return true;
    }
  }
  return false;
}

/* ---------------- Cálculo de avisos ---------------- */
async function computeAvisos(){
  const hoje = todayISO();
  const triAgora = trimestreStr();
  const resolvidos = (await kvGet('resolvidos', {})) || {};
  const avisados = (await kvGet('avisados', {})) || {};
  const out = [];
  const ativo = id => !(resolvidos[id]) || resolvidos[id] === hoje; // resolvido hoje ainda aparece; depois some

  if(S.importado){
    const rs = await idbAll('residents');
    // Atalhos 👤/🏡 dos avisos: descobrir o morador de guias/agendamentos por cadastro ou nome
    const idPorCadastro = {}, idPorNome = {};
    for(const r of rs){
      if(r.cadastro && idPorCadastro[r.cadastro] === undefined) idPorCadastro[r.cadastro] = r.id;
      const nn = norm(r.nome);
      if(nn){ if(idPorNome[nn] === undefined) idPorNome[nn] = r.id; else idPorNome[nn] = null; }
    }
    const ridDe = a => {
      if(a.cadastro && idPorCadastro[a.cadastro] !== undefined && idPorCadastro[a.cadastro] !== null) return idPorCadastro[a.cadastro];
      const v = idPorNome[norm(a.nome)];
      return (v === undefined || v === null) ? null : v;
    };
    const defs = await idbAll('filterDefs');
    const defPorNome = {}; defs.forEach(d => defPorNome[norm(d.nome)] = d);
    const cnsCount = {};
    for(const r of rs){ const c = onlyDigits(r.cns); if(c) cnsCount[c] = (cnsCount[c]||0)+1; }
    // perfis duplicados: mesmo nome completo + nascimento
    const gruposNN = {};
    for(const r of rs){
      if(!norm(r.nome) || !r.nascimento) continue;
      const k = norm(r.nome) + '|' + r.nascimento;
      (gruposNN[k] = gruposNN[k] || []).push(r);
    }
    for(const k in gruposNN){
      const g = gruposNN[k];
      if(g.length > 1){
        const id = 'dup-'+hashStr(k);
        if(ativo(id)) out.push({id, acao:'RESOLVIDO', feito:!!resolvidos[id], rid:g[0].id,
          titulo:'Perfis possivelmente duplicados ('+g.length+')',
          texto: esc(g[0].nome)+' · '+fmtDate(g[0].nascimento)+' — '+g.length+' perfis com o mesmo nome e nascimento. Verifique e unifique os dados.'});
      }
    }
    for(const r of rs){
      // 1) cadastros incompletos
      const faltas = [];
      if(!onlyDigits(r.cadastro)) faltas.push('cadastro (cartão cidadão)');
      if(!onlyDigits(r.cpf)) faltas.push('CPF');
      const c = onlyDigits(r.cns);
      if(!c) faltas.push('CNS');
      else if(cnsCount[c] > 1) faltas.push('CNS em duplicidade');
      if(!norm(r.mae)) faltas.push('nome da mãe');
      if(!r.nascimento) faltas.push('data de nascimento');
      if(!norm(r.endereco) || !String(r.numero||'').trim()) faltas.push('endereço completo (com número)');
      if(faltas.length){
        const id = 'inc-'+r.id;
        if(ativo(id)) out.push({id, acao:'RESOLVIDO', feito:!!resolvidos[id], rid:r.id,
          titulo:'Cadastro incompleto',
          texto: esc(r.nome||'(sem nome)')+' — falta: '+faltas.join(', ')});
      }
      // 2) validade de filtros chegando (10 dias)
      for(const f of (r.filtros||[])){
        if(f.validade){
          const d = diffDias(f.validade, hoje);
          if(d >= 0 && d <= 10){
            const id = 'val-'+r.id+'-'+norm(f.nome)+'-'+f.validade;
            if(ativo(id)) out.push({id, acao:'RESOLVIDO', feito:!!resolvidos[id], rid:r.id,
              titulo:'Filtro com validade chegando ('+(d===0?'hoje':d+' dia'+(d===1?'':'s'))+')',
              texto: esc(r.nome||'(sem nome)')+' — filtro '+esc(f.nome)+' vale até '+fmtDate(f.validade)});
          }
        }
      }
      // 3) periodicidade de visitas (aviso de visita atrasada se vencida)
      for(const f of (r.filtros||[])){
        const def = defPorNome[norm(f.nome)];
        if(def && def.periodicidade > 0){
          const visitas = (r.visitas||[]).map(v => v.data).filter(Boolean).sort();
          const base = visitas.length ? visitas[visitas.length-1] : (f.desde || hoje);
          const prazo = addMeses(base, def.periodicidade);
          const d = diffDias(prazo, hoje);
          if(d < 0){
            // Vencida: visita atrasada
            const id = 'per-'+r.id+'-'+norm(f.nome);
            out.push({id, acao:'REGISTRAR_VISITA', feito:false, rid:r.id,
              titulo:'Visita domiciliar atrasada',
              texto: esc(r.nome||'(sem nome)')+' — motivo '+esc(f.nome)});
          }
        }
      }
      // (aniversariantes removidos — agora exibidos no CALENDÁRIO)
    }
    // 5) agendamentos (1 dia antes; some quando o dia da consulta termina)
    const ags = await idbAll('appointments');
    for(const a of ags){
      const d = diffDias(a.data, hoje);
      if(d >= 0 && d <= 1){
        out.push({id:'ag-'+a.id, acao:'AVISADO', feito:!!avisados['ag-'+a.id], rid:ridDe(a),
          titulo:'Consulta '+(d===1?'amanhã':d===0?'hoje':''),
          texto: esc(a.nome||'(sem nome)')+' — '+(a.profissional?('com '+esc(a.profissional)+', '):'')+fmtDate(a.data)+(a.hora?(' às '+esc(a.hora)):'')});
      }
    }
    // 6) guias de exames (5 dias antes; some quando o dia do exame termina)
    const guias = await idbAll('guides');
    for(const g of guias){
      if(g.situacao !== 'comigo' || !g.data) continue;
      const d = diffDias(g.data, hoje);
      if(d >= 0 && d <= 5){
        out.push({id:'gu-'+g.id, acao:'AVISADO', feito:!!avisados['gu-'+g.id], rid:ridDe(g),
          titulo:'Exame '+(d===0?'hoje':d===1?'amanhã':'em '+d+' dias'),
          texto: esc(g.nome||'(sem nome)')+' — '+esc(g.exame||'exame')+' em '+esc(g.local||'?')+', '+fmtDate(g.data)+(g.hora?(' às '+esc(g.hora)):'')});
      }
    }
  }
  // 4) expiração de senha (10 dias antes do fim do trimestre)
  if(senhaObrigatoria() && S.usadaTri !== triAgora){
    const dFim = diffDias(fimTrimestreISO(), hoje);
    if(dFim <= 10){
      out.push({id:'senha-'+triAgora, acao:null, feito:false,
        titulo:'Senha expira '+(dFim===0?'hoje':dFim===1?'amanhã':'em '+dFim+' dia'+(dFim===1?'':'s')),
        texto:'Fim do trimestre '+triAgora+': use a nova senha sazonal para eliminar este aviso.'});
    }
  }
  return out;
}

    '</div></div>';
  const alfabeto = SENHA_ALFABETO.split('');
  const senhaAtual = () => senhaAtiva();
  function novaRodada(){
    const s = senhaAtual();
    if(PS.pos >= 4) return;
    const pool = alfabeto.filter(c => c !== s[PS.pos]);
    for(let i = pool.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
    const chars = pool.slice(0, 11); chars.push(s[PS.pos]);
    for(let i = chars.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = chars[i]; chars[i] = chars[j]; chars[j] = t; }
    $$('#sg .senha-btn').forEach((b, i) => { b.textContent = chars[i*3] + chars[i*3+1] + chars[i*3+2]; });
  }
  function flash(){
    $$('#sg .senha-btn').forEach(b => { b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); });
  }
  function bloquear(){
    PS.bloqueada = true;
    if(S.senhaCustom){ S.senhaCustom = null; salvarEstado(); } // senha personalizada é cancelada
  }
  $$('#sg .senha-btn').forEach(b => b.addEventListener('click', () => {
    flash();
    const s = senhaAtual();
    const acertou = !PS.bloqueada && b.textContent.includes(s[PS.pos]);
    setTimeout(() => {
      if(acertou){
        PS.pos++;
        if(PS.pos >= 4){ desbloquear(); return; }
      } else {
        PS.err++;
        if(PS.err >= 3 && !PS.bloqueada) bloquear();
      }
      novaRodada();
    }, 200);
  }));
  $('#bt-recomecar').addEventListener('click', () => {
    flash();
    PS.pos = 0; PS.resets++;
    setTimeout(() => {
      if(PS.resets >= 3 && !PS.bloqueada) bloquear();
      novaRodada();
    }, 200);
  });
  $('#bt-voltar2').addEventListener('click', () => resetStack('nome'));
  novaRodada();
  async function desbloquear(){
    desbloqueada = true;
    if(senhaEhSazonal()){ S.usadaTri = trimestreStr(); }
    await salvarEstado();
    await irPosDesbloqueio();
  }
});
/* ---------------- Helpers de escrita em lote ---------------- */
function idbBulkPut(store, arr){
  return idb().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    arr.forEach(v => os.put(v));
    t.oncomplete = () => res(arr.length);
    t.onerror = () => rej(t.error);
  }));
}
function idbBulkDel(store, keys){
  return idb().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, 'readwrite');
    const os = t.objectStore(store);
    keys.forEach(k => os.delete(k));
    t.oncomplete = () => res(keys.length);
    t.onerror = () => rej(t.error);
  }));
}

/* ---- Reconhecimento dos relatórios do BI pelo CONTEÚDO do cabeçalho ---- */
const ASSINATURAS = {
  s1: ['cadastro nome','cadastro dn','numero imovel','cadastro cns','cadastro sexo','tipo logradouro','logradouro'],
  s2: ['usuario saude nome','data nascimento','doenca cardiaca','esta domiciliado','esta acamado','esta gestante','usa alcool','usa drogas','fumante','hipertensao','diabetes','cancer','hanseniase','tuberculose','planta medicinal'],
  s3: ['cidadao nome','cidadao dn','cartao cidadao','nome do pai','pais de nascimento','equipe nome','tel residencial','tel celular','tel recado','codigo ine']
};
const PALAVRA_ARQ = { s1:'analise detalhada', s2:'auto referido', s3:'cadastros detalhados' };
function pontuarCabecalho(rows){
  const hitT = { s1:0, s2:0, s3:0 };
  const info = { s1:null, s2:null, s3:null };
  const lim = Math.min(8, rows.length);
  for(let i = 0; i < lim; i++){
    const vista = new Map();
    const r = rows[i] || [];
    for(let j = 0; j < r.length; j++){
      const c = norm(r[j]);
      if(c && !vista.has(c)) vista.set(c, j);
    }
    for(const t of ['s1','s2','s3']){
      let hit = 0;
      const mapa = new Map();
      for(const tok of ASSINATURAS[t]) if(vista.has(tok)){ hit++; mapa.set(tok, vista.get(tok)); }
      if(hit > hitT[t]){ hitT[t] = hit; if(hit >= 2) info[t] = { linha:i, mapa, todos:vista }; }
    }
  }
  return { hitT, info };
}
function detectarPlanilha(nomeArq, rows){
  const { hitT } = pontuarCabecalho(rows);
  const arq = norm(nomeArq);
  for(const t of ['s1','s2','s3']) if(arq.includes(PALAVRA_ARQ[t])) hitT[t] += 2; // nome do arquivo ajuda, mas não decide sozinho
  let melhor = null, n = 0;
  for(const t of ['s1','s2','s3']) if(hitT[t] > n){ n = hitT[t]; melhor = t; }
  return n >= 2 ? melhor : null;
}

function criarResolutor(rows, tipo, pinos){
  const { info } = pontuarCabecalho(rows);
  const inf = info[tipo];
  const todos = inf ? (inf.todos || inf.mapa) : null;
  const cache = {};
  const idx = campo => {
    if(cache[campo] !== undefined) return cache[campo];
    let i = -1;
    const p = pinos[campo];
    if(todos){ for(const a of p.alias){ if(todos.has(a)){ i = todos.get(a); break; } } }
    if(i < 0) i = colIdx(p.letra);
    cache[campo] = i;
    return i;
  };
  return { idx, ini: inf ? inf.linha + 1 : 0 }; // dados começam APÓS a linha de cabeçalho detectada
}

}

async function lerArquivoTexto(file){
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  if(bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if(bytes[0] === 0xFE && bytes[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  let txt = new TextDecoder('utf-8', {fatal:false}).decode(buf);
  if((txt.match(/\uFFFD/g)||[]).length > 0) txt = new TextDecoder('windows-1252').decode(buf); // qualquer U+FFFD ⇒ não é UTF-8
  return txt;
}

async function salvarImportacao(){
  showLoading('Montando perfis…', 'Cruzando CNS, CPF e nome+nascimento entre os relatórios');
  await yieldUI();
  try{
    const perfis = mesclarPerfis([]
      .concat(IMP.parsed.s1 && IMP.parsed.s1.regs || [])
      .concat(IMP.parsed.s2 && IMP.parsed.s2.regs || [])
      .concat(IMP.parsed.s3 && IMP.parsed.s3.regs || []));
    setLoadingMsg('Salvando base de moradores…', perfis.length.toLocaleString('pt-BR') + ' perfis');
    await yieldUI();
    await clrRes();
    await bulkPutRes(perfis);
    // definições iniciais de filtros
    const defs = await idbAll('filterDefs');
    const nomes = new Set(defs.map(d => norm(d.nome)));
    const novas = FILTROS_INICIAIS.filter(n => !nomes.has(norm(n))).map(n => ({nome:n, periodicidade:6})); // padrão 6 meses
    if(novas.length) await idbBulkPut('filterDefs', novas);
    S.importado = true;
    await salvarEstado();
    if(S.areaDefinida){
      setLoadingMsg('Aplicando sua área…', 'Removendo moradores fora dos endereços de atuação');
      await yieldUI();
      const mantidos = await aplicarArea();
      toast(perfis.length.toLocaleString('pt-BR')+' perfis importados · '+mantidos.toLocaleString('pt-BR')+' na sua área');
    } else {
      toast(perfis.length.toLocaleString('pt-BR')+' perfis de morador criados');
    }
    IMP.parsed = {}; IMP.desconhecidos = [];
  } finally {
    hideLoading();
  }
  if(!S.areaDefinida) resetStack('area'); else resetStack('menu');
}
function mesclarPerfis(regs){
  const perfis = [];
  const idxCns = new Map(), idxCpf = new Map(), idxNN = new Map();
  for(const reg of regs){
    const d = reg.d;
    const cns = onlyDigits(d.cns), cpf = onlyDigits(d.cpf);
    const temNN = !!norm(d.nome) && !!d.nascimento;
    const nn = norm(d.nome) + '|' + (d.nascimento||'');
    let alvo = null;
    if(cns && idxCns.has(cns)) alvo = idxCns.get(cns);
    else if(cpf && idxCpf.has(cpf)) alvo = idxCpf.get(cpf);
    else if(temNN && idxNN.has(nn)) alvo = idxNN.get(nn);
    if(!alvo){ alvo = { p:{}, cnsVistos:[] }; perfis.push(alvo); }
    if(cns){
      if(!idxCns.has(cns)){ idxCns.set(cns, alvo); alvo.cnsVistos.push(cns); }
      if(alvo.cnsVistos.length > 1) alvo.p.cnsExtra = alvo.cnsVistos[1];
    }
    if(cpf && !idxCpf.has(cpf)) idxCpf.set(cpf, alvo);
    if(temNN && !idxNN.has(nn)) idxNN.set(nn, alvo);
    for(const k in d){
      const v = d[k];
      if(v === '' || v == null) continue;
      // Sanitiza textos vindos do CSV (sem tags HTML, sem caracteres de controle)
      const vv = typeof v === 'string' ? sanitizarTexto(v) : v;
      if(vv === '' || vv == null) continue;
      if(alvo.p[k] === undefined || alvo.p[k] === '' || alvo.p[k] === false) alvo.p[k] = vv;
    }
  }
  return perfis.map(a => {
    const p = a.p;
    const cond = { cardiaca:!!p.c_cardiaca, respiratoria:!!p.c_respiratoria, domiciliado:!!p.c_domiciliado,
      acamado:!!p.c_acamado, gestante:!!p.c_gestante, etilista:!!p.c_etilista, drogas:!!p.c_drogas,
      tabaco:!!p.c_tabaco, has:!!p.c_has, dm:!!p.c_dm, cancer:!!p.c_cancer,
      hanseniase:!!p.c_hanseniase, tuberculose:!!p.c_tuberculose };
    const filtros = [];
    for(const k in COND_FILTRO) if(cond[k]) filtros.push({nome:COND_FILTRO[k], origem:'importado', desde:todayISO()});
    return { nome:p.nome||'', nascimento:p.nascimento||'', mae:p.mae||'', pai:p.pai||'',
      cpf:onlyDigits(p.cpf), cns:onlyDigits(p.cns), cnsExtra:p.cnsExtra||'', cadastro:onlyDigits(p.cadastro),
      sexo:p.sexo||'', raca:p.raca||'', etnia:p.etnia||'', pais:p.pais||'',
      endereco:stripTipoLogradouro(p.endereco||''), numero:String(p.numero||'').trim(),
      telRes:onlyDigits(p.telRes), telCel:onlyDigits(p.telCel), telRec:onlyDigits(p.telRec),
      cond, filtros, visitas:[], obs:'' };
  });
}

async function ruasDoBanco(){
  const rs = await idbAll('residents');
  const m = new Map();
  for(const r of rs){
    const e = (r.endereco||'').trim();
    if(!e) continue;
    const k = norm(e);
    if(!k) continue;
    if(!m.has(k)) m.set(k, {rua:e, n:0});
    m.get(k).n++;
  }
  return Array.from(m.values()).sort((a,b) => a.rua.localeCompare(b.rua,'pt-BR'));
}
/*
 Mantém moradores apenas dentro da área definida; os demais são excluídos
 para economizar espaço e acelerar o app.
*/
async function aplicarArea(){
  const cards = await idbAll('area');
  const rs = await idbAll('residents');
  if(!cards.length) return rs.length; // sem cartões: mantém tudo
  const dentro = r => {
    const ruaN = norm(r.endereco);
    if(!ruaN) return false;
    const numStr = String(r.numero||'').trim();
    const num = parseInt(numStr.replace(/\D/g,''),10);
    const temNum = numStr !== '' && !isNaN(num);
    for(const c of cards){
      if(norm(c.rua) !== ruaN) continue;
      const temComeco = c.comeco !== '' && c.comeco != null && !isNaN(+c.comeco);
      const temFim = c.fim !== '' && c.fim != null && !isNaN(+c.fim);
      if((temComeco || temFim) && !temNum) continue;
      if(temComeco && num < +c.comeco) continue;
      if(temFim && num > +c.fim) continue;
      const par = temNum && num % 2 === 0, imp = temNum && num % 2 === 1;
      if(c.impares && !c.pares && !imp) continue;
      if(c.pares && !c.impares && !par) continue;
      return true;
    }
    return false;
  };
  const manter = rs.filter(dentro);
  const fora = rs.filter(r => !dentro(r));
  if(fora.length) await bulkDelRes(fora.map(r => r.id));
  return manter.length;
}
