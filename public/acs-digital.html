/* ================= TELA DE MORADORES ================= */
const MOR = { st: novoEstadoOrd(), filtrosAtivos: [], defs: [], mostrarTodos: false, filtrosVisivel: false };
registerScreen('moradores', (app) => {
  app.innerHTML = topbarHTML({titulo:'MORADORES', esq:{}}) +
    '<div class="content">' +
      '<div id="mor-sorts"></div>' +
      '<div class="search-box mt"><input id="mor-q" placeholder="Buscar morador, endereço, CNS…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">' +
        '<button class="clear-x" id="mor-x" style="display:none">❌</button></div>' +
      '<div id="mor-hist"></div>' +
      '<div class="filt-head"><div class="small" style="font-weight:700">FILTROS</div>' +
        '<button class="filt-toggle" id="mor-ftog" title="Mostrar ou ocultar os filtros" aria-expanded="false">🔽</button></div>' +
      '<p class="tiny muted" style="margin:.15rem 0 0">Toque para marcar vários; o morador precisa ter todos os marcados. Ocultar não desativa os filtros escolhidos.</p>' +
      '<div class="chips" id="mor-fchips" style="display:'+(MOR.filtrosVisivel?'flex':'none')+'"></div>' +
      '<div id="mor-result" class="mt"></div>' +
    '</div>';
  $('#tb-voltar').addEventListener('click', navBack);
  $('#mor-sorts').innerHTML = htmlSortRow(MOR.st);
  bindSortRow($('#mor-sorts'), MOR.st, executar);
  const q = $('#mor-q'), xBt = $('#mor-x'), resDiv = $('#mor-result');
  // chips de filtros: NENHUM FILTRO (limpa tudo) + filtros em ordem alfabética
  (async () => {
    const defs = await idbAll('filterDefs');
    MOR.defs = defs.map(d => d.nome).sort((a,b) => a.localeCompare(b, 'pt-BR'));
    renderFiltroChips();
  })();
  function renderFiltroChips(){
    const cont = $('#mor-fchips');
    if(!cont) return;
    const at = MOR.filtrosAtivos;
    cont.innerHTML =
      '<button type="button" class="chip-t limpar'+(at.length ? '' : ' on')+'" data-limpar title="Limpa todos os filtros marcados">NENHUM FILTRO</button>' +
      MOR.defs.map(n => '<button type="button" class="chip-t'+(at.some(a => norm(a) === norm(n)) ? ' on' : '')+'" data-f="'+esc(n)+'">'+esc(n)+'</button>').join('');
    cont.querySelector('[data-limpar]').addEventListener('click', () => {
      if(!MOR.filtrosAtivos.length) return;
      MOR.filtrosAtivos = [];
      renderFiltroChips(); executar();
    });
    cont.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.f;
      const i = MOR.filtrosAtivos.findIndex(a => norm(a) === norm(n));
      if(i >= 0) MOR.filtrosAtivos.splice(i, 1); else MOR.filtrosAtivos.push(n);
      renderFiltroChips(); executar();
    }));
  }
  function salvarHistorico(termo){
    if(!termo) return;
    kvGet('searchHist', []).then(l => {
      l = [termo].concat((l||[]).filter(t => norm(t) !== norm(termo))).slice(0,3);
      kvSet('searchHist', l).then(renderHist);
    });
  }
  function renderHist(){
    kvGet('searchHist', []).then(l => {
      const div = $('#mor-hist');
      if(!l || !l.length){ div.innerHTML = ''; return; }
      div.innerHTML = '<div class="hist-line">'+l.map(t => '<button class="hist-chip" data-t="'+esc(t)+'">🔎 '+esc(t)+'</button>').join('')+'</div>';
      div.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { q.value = b.dataset.t; q.focus(); executar(); }));
    });
  }
  async function executar(){
    await refreshFilterDefsCache();
    const qv = q.value.trim();
    xBt.style.display = qv ? 'block' : 'none';
    const rs = await idbAll('residents');
    let lista = null, hint = '';
    if(!qv){
      if(!MOR.mostrarTodos){
        resDiv.innerHTML = '<button class="btn btn-block mt" id="mor-todos" style="margin-top:1rem">MOSTRAR TODOS</button>';
        const b = $('#mor-todos');
        if(b) b.addEventListener('click', () => { MOR.mostrarTodos = true; executar(); });
        return;
      }
      lista = rs.slice();
    } else {
      const it = interpretarBusca(qv);
      if(it.tipo === 'nenhum'){ hint = TXT_BUSCA_NENHUM; lista = []; }
      else { lista = buscarMoradores(rs, it); salvarHistorico(qv); }
    }
    if(MOR.filtrosAtivos.length){
      // busca combinada: o morador precisa ter TODOS os filtros marcados
      const at = MOR.filtrosAtivos.map(norm);
      lista = lista.filter(r => {
        const fs = filtrosDoMorador(r).map(norm);
        return at.every(a => fs.includes(a));
      });
    }
    ordenarMoradores(lista, MOR.st.org);
    const filtroTxt = MOR.filtrosAtivos.length
      ? '<p class="small muted mt">Filtros ativos: <b>'+MOR.filtrosAtivos.map(esc).join('</b> + <b>')+'</b></p>'
      : '';
    resDiv.innerHTML = filtroTxt +
      (hint ? '<p class="small muted mt">'+hint+'</p>' :
      (lista.length ?
        '<p class="small muted mt">'+lista.length+' morador'+(lista.length>1?'es':'')+'</p>' : '') +
      '<div class="row-list">' +
        lista.slice(0, 400).map(r => moradorRowHTML(r, {acoes:'<span class="row-btns"><button class="mini-btn" data-rz="'+r.id+'" title="Abrir a residência deste morador">🏡</button></span>'})).join('') +
        (lista.length > 400 ? '<p class="tiny muted center">Exibindo os primeiros 400 — refine a busca.</p>' : '') +
      '</div>' +
      (!lista.length ? '<p class="small muted center mt">Nenhum morador encontrado.</p>' : ''));
    resDiv.querySelectorAll('.p-row').forEach(row => row.addEventListener('click', () => go('perfil', {id:+row.dataset.id})));
    resDiv.querySelectorAll('[data-rz]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      goResidencia(+b.dataset.rz);
    }));
    // Botões 📆 (calendário) — adicionados dinamicamente por morador com evento
    (async () => {
      const evs = await getEventosCalendario();
      const hoje = todayISO();
      const hojeD = new Date(hoje + 'T00:00:00');
      const lim = new Date(hojeD); lim.setDate(lim.getDate() + 30);
      const limISO = lim.toISOString().substr(0,10);
      const evsProx = evs.filter(e => e.dataISO >= hoje && e.dataISO <= limISO);
      resDiv.querySelectorAll('.p-row').forEach(row => {
        const id = +row.dataset.id;
        // Encontra morador para pegar cadastro
        const r = lista.find(x => x.id === id);
        if(!r) return;
        const temEv = evsProx.some(e => {
          if(e.tipo === 'aniversario') return e.moradorId === id;
          if(e.cadastro && r.cadastro) return String(e.cadastro).trim() === String(r.cadastro).trim();
          return false;
        });
        if(temEv){
          const div = document.createElement('div');
          div.className = 'row-btns-vert';
          div.innerHTML = '<button class="cal-icon-btn" data-cal="'+id+'" title="Abrir Calendário">📆</button>';
          row.querySelector('.p-head').appendChild(div);
        }
      });
      resDiv.querySelectorAll('[data-cal]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        go('calendario');
      }));
    })();
  }
  q.addEventListener('input', debounce(() => { if(!q.value.trim()) MOR.mostrarTodos = false; executar(); }, 260));
  $('#mor-x').addEventListener('click', () => { q.value=''; xBt.style.display='none'; MOR.mostrarTodos=false; executar(); q.focus(); });
  const ftog = $('#mor-ftog');
  ftog.textContent = MOR.filtrosVisivel ? '🔼' : '🔽';
  ftog.setAttribute('aria-expanded', MOR.filtrosVisivel ? 'true' : 'false');
  ftog.addEventListener('click', () => {
    MOR.filtrosVisivel = !MOR.filtrosVisivel;
    const c = $('#mor-fchips');
    if(c) c.style.display = MOR.filtrosVisivel ? 'flex' : 'none';
    ftog.textContent = MOR.filtrosVisivel ? '🔼' : '🔽';
    ftog.setAttribute('aria-expanded', MOR.filtrosVisivel ? 'true' : 'false');
  });
  renderHist();
  executar();
});

/* ================= TELA DE RESIDÊNCIAS ================= */
/*
  Lista de endereços completos (logradouro sem tipo + número, zeros à esquerda
  ignorados). Tocar no endereço expande e mostra os moradores daquela casa
  (nome completo, cadastro — cartão cidadão — e botão 👤 para o perfil).
  Chips de rua com múltipla escolha: TODAS limpa a seleção.
*/
const REZ = { abertos: {}, ruasSel: [] };
registerScreen('residencias', (app, p) => {
  p = p || {};
  app.innerHTML = topbarHTML({titulo:'RESIDÊNCIAS', esq:{}}) +
    '<div class="content">' +
      '<div class="small" style="font-weight:700">FILTROS</div>' +
      '<p class="tiny muted" style="margin:.15rem 0 0">Toque para escolher uma ou mais ruas. TODAS limpa a seleção.</p>' +
      '<div class="chips" id="rz-chips"></div>' +
      '<div id="rz-cont" class="mt"></div>' +
    '</div>';
  $('#tb-voltar').addEventListener('click', navBack);
  let casas = []; // {k, rua, num, m:[moradores]}
  (async () => {
    const rs = await idbAll('residents');
    const m = new Map();
    for(const r of rs){
      const rua = stripTipoLogradouro(r.endereco||'');
      if(!rua && !String(r.numero||'').trim()) continue;
      const k = chaveRes(r);
      if(!m.has(k)) m.set(k, {k, rua, num: numeroExibicao(r.numero), m:[]});
      m.get(k).m.push(r);
    }
    casas = [...m.values()].sort((a,b) => a.rua.localeCompare(b.rua,'pt-BR') || a.num.localeCompare(b.num,'pt-BR',{numeric:true}));
    if(p.expand){
      const alvo = casas.find(c => c.k === p.expand);
      if(alvo) REZ.abertos[alvo.k] = true;
    }
    renderChips();
    renderLista();
  })();
  function ruasUnicas(){
    const v = [];
    for(const c of casas) if(!v.some(x => norm(x) === norm(c.rua))) v.push(c.rua);
    return v.sort((a,b) => a.localeCompare(b,'pt-BR'));
  }
  function renderChips(){
    const cont = $('#rz-chips');
    if(!cont) return;
    const sel = REZ.ruasSel;
    cont.innerHTML =
      '<button type="button" class="chip-t limpar'+(sel.length ? '' : ' on')+'" data-todas title="Mostra os endereços de todas as ruas">TODAS</button>' +
      ruasUnicas().map(n => '<button type="button" class="chip-t'+(sel.some(a => norm(a) === norm(n)) ? ' on' : '')+'" data-rua="'+esc(n)+'">'+esc(n)+'</button>').join('');
    cont.querySelector('[data-todas]').addEventListener('click', () => {
      if(!REZ.ruasSel.length) return;
      REZ.ruasSel = [];
      renderChips(); renderLista();
    });
    cont.querySelectorAll('[data-rua]').forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.rua;
      const i = REZ.ruasSel.findIndex(a => norm(a) === norm(n));
      if(i >= 0) REZ.ruasSel.splice(i, 1); else REZ.ruasSel.push(n);
      renderChips(); renderLista();
    }));
  }
  function renderLista(){
    const cont = $('#rz-cont');
    if(!cont) return;
    let lista = casas;
    if(REZ.ruasSel.length){
      const sel = REZ.ruasSel.map(norm);
      lista = lista.filter(c => sel.includes(norm(c.rua)));
    }
    const abertas = lista.filter(c => REZ.abertos[c.k]).length;
    cont.innerHTML =
      '<p class="small muted">'+lista.length+' residência'+(lista.length!==1?'s':'')+' · '+
        lista.reduce((s,c)=>s+c.m.length,0).toLocaleString('pt-BR')+' morador'+(abertas?' · '+abertas+' expandida'+(abertas>1?'s':''):'')+'</p>' +
      (lista.length ?
        '<div class="row-list">' +
          lista.map(c => {
            const aberto = !!REZ.abertos[c.k];
            const titulo = c.rua + (c.num ? ', ' + c.num : '');
            return '<div class="p-row" data-k="'+esc(c.k)+'">' +
              '<span class="p-head"><span class="p-nome">'+esc(titulo)+'</span><span class="res-seta">'+(aberto?'▾':'▸')+' '+c.m.length+'</span></span>' +
              (aberto ?
                '<div class="res-exp">' +
                  c.m.sort((a,b) => String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR')).map(r =>
                    '<div class="res-mor">' +
                      '<span class="rm-nome">'+esc(r.nome||'(sem nome)')+'</span>' +
                      '<span class="rm-cad">'+esc(r.cadastro || 'sem cadastro')+'</span>' +
                      '<button class="mini-btn" data-perfil="'+r.id+'" title="Abrir o perfil deste morador">👤</button>' +
                    '</div>').join('') +
                '</div>' : '') +
            '</div>';
          }).join('') +
        '</div>'
        : '<p class="small muted center mt">Nenhuma residência encontrada'+(REZ.ruasSel.length?' para as ruas escolhidas':'')+'.</p>');
    cont.querySelectorAll('.p-row').forEach(row => row.addEventListener('click', () => {
      const k = row.dataset.k;
      if(REZ.abertos[k]) delete REZ.abertos[k]; else REZ.abertos[k] = true;
      renderLista();
    }));
    cont.querySelectorAll('[data-perfil]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      go('perfil', {id:+b.dataset.perfil});
    }));
  }
});

/* ================= PERFIL DE MORADOR ================= */
function linkWhatsApp(fone){
  let d = onlyDigits(fone);
  if(!d) return '';
  if(d.length >= 12 && d.length <= 13 && d.startsWith('55')) return 'https://wa.me/' + d;
  return 'https://wa.me/55' + d;
}
registerScreen('perfil', async (app, p) => {
  const rs = await idbAll('residents');
  const r = rs.find(x => x.id === p.id);
  if(!r){
    app.innerHTML = topbarHTML({titulo:'PERFIL', esq:{}}) + '<div class="content"><p>Morador não encontrado.</p></div>';
    $('#tb-voltar').addEventListener('click', navBack);
    return;
  }
  const linha = (lab, val) => val ? '<div class="i-line"><span class="i-lab">'+lab+'</span>'+val+'</div>' : '';
  // Linha "Nome da mãe" com possível botão 📆 (calendário) alinhado à direita
  const temEventoCal = await moradorTemEventoCalendario(r);
  const linhaMae = (r.mae || temEventoCal)
    ? '<div class="i-line mae-linha"><span class="i-lab">Nome da mãe</span>' +
        '<span class="mae-val">'+esc(r.mae||'(não informado)')+'</span>' +

      '</div>'
    : '';
  const conds = [];

    acamado:'Acamado', gestante:'Gestante', etilista:'Etílico habitual', drogas:'Drogas habitual',
    tabaco:'Tabagista habitual', has:'HAS', dm:'DM', cancer:'Câncer', hanseniase:'Hanseníase', tuberculose:'Tuberculose' };
  for(const k in COND_NOMES) if(r.cond && r.cond[k]) conds.push(COND_NOMES[k]);
  const filtros = filtrosDoMorador(r);
  const visitas = (r.visitas||[]).slice().sort((a,b) => (b.data||'').localeCompare(a.data||''));
  const fones = [r.telCel, r.telRes, r.telRec].filter(Boolean);
  const wa = linkWhatsApp(r.telCel || r.telRes || r.telRec || '');
  app.innerHTML = topbarHTML({titulo:'PERFIL DE MORADOR', esq:{}}) +
    '<div class="content">' +
      '<h2 style="text-transform:uppercase;font-size:1.15rem;line-height:1.25">'+esc(r.nome||'(sem nome)')+'</h2>' +
      '<div class="info-box mt">' +
        linhaMae +
        linha('Nome do pai', esc(r.pai||'')) +
        linha('Data de nascimento', esc(fmtDate(r.nascimento)+' '+idadeTxt(r))) +
        linha('Cadastro (cartão cidadão)', esc(r.cadastro||'')) +
        linha('CPF', esc(r.cpf||'')) +
        linha('CNS', esc(r.cns||'') + (r.cnsExtra ? ' <span class="tiny muted">(2º CNS: '+esc(r.cnsExtra)+')</span>' : '')) +
        linha('Endereço completo', esc(linhaEndereco(r))) +
        (fones.length ? '<div class="i-line"><span class="i-lab">Telefone</span>'+esc(fones.join(' · '))+
          (wa ? '<button class="wa-btn" id="pf-wa">📱 WhatsApp</button>' : '')+'</div>' : '') +
        linha('Sexo', esc(r.sexo||'')) +
        linha('Raça / Etnia', esc([r.raca, r.etnia].filter(Boolean).join(' / '))) +
        linha('País de origem', esc(r.pais||'')) +
        (conds.length ? '<div class="i-line"><span class="i-lab">Condições de saúde</span>'+conds.map(c=>'<span class="badge imp" style="margin-right:.25rem">'+esc(c)+'</span>').join('')+'</div>' : '') +
        (filtros.length ? '<div class="i-line"><span class="i-lab">Filtros</span>'+filtros.map(f=>{
            const fv = (r.filtros||[]).find(x => norm(x.nome)===norm(f) && x.validade);
            return '<span class="badge imp" style="margin-right:.25rem">'+esc(f)+(fv?' · até '+fmtDate(fv.validade):'')+'</span>';
          }).join('')+'</div>' : '') +
        (visitas.length ? '<div class="i-line"><span class="i-lab">Visitas domiciliares</span>'+
          visitas.map(v => fmtDate(v.data)+' — '+(v.status==='nao'?'não realizada':'realizada')).map(esc).join('<br>')+'</div>' : '') +
        '<div class="i-line"><span class="i-lab">Observações</span>' +
          '<textarea class="obs-area mt" id="pf-obs" placeholder="Anotações sobre o morador…">'+esc(r.obs||'')+'</textarea>' +
        '</div>' +
      '</div>' +
    '</div>';
  $('#tb-voltar').addEventListener('click', navBack);
  const wab = $('#pf-wa');
  if(wab) wab.addEventListener('click', () => window.open(wa, '_blank'));
  const calBtn = $('#pf-cal');
  if(calBtn) calBtn.addEventListener('click', () => go('calendario'));
  $('#pf-obs').addEventListener('change', async () => {
    r.obs = sanitizarTexto($('#pf-obs').value, 2000);
    $('#pf-obs').value = r.obs;
    await putRes(r);
    toast('Observação salva');
  });
});

/* ---- APLICAR: escolhe filtro, seleciona moradores, aplica ---- */
function modalAplicar(){
  (async () => {
    const defs = (await idbAll('filterDefs')).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
    if(!defs.length){ toast('Nenhum filtro cadastrado'); return; }
    openModal(modalTop('APLICAR') +
      '<p class="small muted">Toque no filtro que será aplicado aos moradores:</p>' +
      defs.map(d => '<button class="btn btn-block" data-def="'+esc(d.nome)+'" style="margin-top:.45rem;justify-content:flex-start">🏷️ '+esc(d.nome)+'</button>').join(''));
    bindModalVoltar(closeModal);
    $$('#modal-root [data-def]').forEach(b => b.addEventListener('click', () => modalAplicarEscolher(b.dataset.def)));
  })();
}
function modalAplicarEscolher(nomeFiltro){
  const st = { todos:false, ord:novoEstadoOrd(), sel:new Set(), reexec:exec };
  openModal(
    modalTopDup('APLICAR FILTRO', 'VOLTAR', 'ap-cancel') +
    '<button class="btn btn-g btn-block" id="ap-go">APLICAR filtro '+esc(nomeFiltro)+'</button>' +
    '<div id="ap-sorts"></div>' +
    '<div class="search-box mt"><input id="ap-q" placeholder="Buscar morador…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></div>' +
    '<div id="ap-res" class="mt"></div>', {alto:true});
  bindModalVoltar(() => modalAplicar());
  $('#ap-sorts').innerHTML = htmlSortRow(st.ord);
  bindSortRow($('#ap-sorts'), st.ord, exec);
  const q = $('#ap-q'), res = $('#ap-res');
  async function exec(){ await resultadoModalBusca(res, q, st, (id, row) => {
    if(st.sel.has(id)){ st.sel.delete(id); row.classList.remove('selected'); }
    else { st.sel.add(id); row.classList.add('selected'); }
  }); }
  q.addEventListener('input', debounce(exec, 260));
  exec();
  $('#ap-go').addEventListener('click', async () => {
    if(!st.sel.size){ toast('Selecione ao menos um morador na lista'); return; }
    const rs = await idbAll('residents');
    let n = 0;
    for(const r of rs){
      if(!st.sel.has(r.id)) continue;
      r.filtros = r.filtros || [];
      if(!r.filtros.some(f => norm(f.nome) === norm(nomeFiltro))){
        r.filtros.push({nome:nomeFiltro, origem:'aplicado', desde:todayISO()});
        await putRes(r);
        n++;
      }
    }
    closeModal();
    toast(n ? ('Filtro '+nomeFiltro+' aplicado a '+n+' morador'+(n>1?'es':'')) : 'Todos os selecionados já tinham esse filtro');
  });
}

async function modalEditarMorador(idM){
  const rs = await idbAll('residents');
  const r = rs.find(x => x.id === idM);
  if(!r){ toast('Morador não encontrado'); return; }
  const defs = (await idbAll('filterDefs')).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  let lista = (r.filtros||[]).map(f => ({nome:f.nome, validade:f.validade||'', origem:f.origem||'aplicado'}));
  function render(){
    const disponiveis = defs.filter(d => !lista.some(f => norm(f.nome) === norm(d.nome)));
    openModal(
      modalTopDup('EDITAR — '+r.nome, 'SALVAR', 'em-salvar') +
      '<div class="card" style="margin-top:.3rem"><div class="card-title">Filtros do morador</div>' +
      (lista.length ? lista.map((f,i) =>
        '<div class="area-card" style="margin-top:.4rem" data-i="'+i+'">' +
          '<div class="area-head"><span class="a-nome">'+esc(f.nome)+'</span><button class="del-x" data-rm="'+i+'">❌</button></div>' +
          '<label class="tiny muted">Validade (opcional)</label>' +
          '<input type="date" class="inp" data-vd="'+i+'" value="'+esc(f.validade)+'">' +
        '</div>').join('')
        : '<p class="small muted">Nenhum filtro neste morador.</p>') +
      '</div>' +
      (disponiveis.length ?
        '<label class="fld">Adicionar filtro</label>' +
        '<div class="sel-wrap"><select id="em-add">'+disponiveis.map(d=>'<option value="'+esc(d.nome)+'">'+esc(d.nome)+'</option>').join('')+'</select></div>' +
        '<button class="btn btn-block mt" id="em-addbt">➕ ADICIONAR</button>'
        : '<p class="tiny muted mt">Todos os filtros já estão aplicados.</p>'));
    bindModalVoltar(() => modalEditar());
    $('#em-salvar').addEventListener('click', async () => {
      r.filtros = lista.map(f => ({nome:f.nome, validade:f.validade||undefined, origem:f.origem}));
      await putRes(r);
      closeModal(); toast('Filtros salvos');
    });
    $$('#modal-root [data-rm]').forEach(b => b.addEventListener('click', () => { lista.splice(+b.dataset.rm,1); render(); }));
    $$('#modal-root [data-vd]').forEach(inp => inp.addEventListener('change', () => { lista[+inp.dataset.vd].validade = inp.value; }));
    const addBt = $('#em-addbt');
    if(addBt) addBt.addEventListener('click', () => {
      const v = $('#em-add').value;
      lista.push({nome:v, validade:'', origem:'aplicado'});
      render();
    });
  }
  render();
}

/* ---- AJUSTAR FILTROS: renomear, periodicidade, excluir, criar ---- */
function modalAjustar(){
  (async () => {
    const defs = (await idbAll('filterDefs')).sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
    openModal(
      modalTop('AJUSTAR FILTROS') +
      '<p class="small muted">Edite nomes, defina periodicidade de visitas (em meses) ou exclua filtros. Excluir remove o filtro de TODOS os moradores.</p>' +
      defs.map((d,i) =>
        '<div class="area-card" data-n="'+esc(d.nome)+'">' +
          '<label class="tiny muted">Nome do filtro</label>' +
          '<input class="inp" data-ren value="'+esc(d.nome)+'">' +
          '<label class="tiny muted" style="margin-top:.35rem">Periodicidade de visita (meses, vazio = sem)</label>' +
          '<input class="inp" inputmode="numeric" data-per placeholder="ex.: 6" value="'+(d.periodicidade||6)+'">' +
          '<button class="btn btn-sm btn-r" data-ex style="margin-top:.5rem">🗑 EXCLUIR FILTRO</button>' +
        '</div>').join('') +
      '<div class="card mt"><div class="card-title">Criar novo filtro</div>' +
        '<input class="inp" id="aj-novo" placeholder="Nome do novo filtro">' +
        '<button class="btn btn-block mt" id="aj-criar">➕ CRIAR FILTRO</button>' +
      '</div>');
    bindModalVoltar(closeModal);
    const renomear = async (nomeAntigo, novo) => {
      novo = sanitizarTexto(novo, 60);
      if(!novo || norm(novo) === norm(nomeAntigo)) return;
      const all = await idbAll('filterDefs');
      if(all.some(d => norm(d.nome) === norm(novo))){ toast('Já existe um filtro com esse nome'); return; }
      const def = all.find(d => norm(d.nome) === norm(nomeAntigo));
      await idbDel('filterDefs', def ? def.nome : nomeAntigo);
      await idbPut('filterDefs', {nome:novo, periodicidade: def ? def.periodicidade : 6});
      const rs = await idbAll('residents');
      for(const r of rs){
        let mudou = false;
        (r.filtros||[]).forEach(f => { if(norm(f.nome) === norm(nomeAntigo)){ f.nome = novo; mudou = true; } });
        if(mudou) await putRes(r);
      }
      toast('Filtro renomeado para '+novo);
      modalAjustar();
    };
    $$('#modal-root [data-ren]').forEach(inp => inp.addEventListener('change', () => {
      renomear(inp.closest('.area-card').dataset.n, inp.value);
    }));
    $$('#modal-root [data-per]').forEach(inp => inp.addEventListener('change', async () => {
      const nome = inp.closest('.area-card').dataset.n;
      const defs2 = await idbAll('filterDefs');
      const def = defs2.find(d => norm(d.nome) === norm(nome));
      if(!def) return;
      def.periodicidade = inp.value ? Math.max(1, parseInt(inp.value.replace(/\D/g,''),10) || 0) : null;
      await idbPut('filterDefs', def);
      toast('Periodicidade salva');
    }));
    $$('#modal-root [data-ex]').forEach(b => b.addEventListener('click', async () => {
      const nome = b.closest('.area-card').dataset.n;
      if(!(await modalConfirmar('Excluir filtro?', 'O filtro "'+esc(nome)+'" será removido de todos os moradores. Confirma?', 'EXCLUIR'))) return;
      if(!(await modalConfirmar('Confirmação final', 'Esta ação não pode ser desfeita. Excluir "'+esc(nome)+'" de todos os moradores?', 'EXCLUIR DEFINITIVAMENTE'))) return;
      const defs2 = await idbAll('filterDefs');
      const def = defs2.find(d => norm(d.nome) === norm(nome));
      if(def) await idbDel('filterDefs', def.nome);
      const rs = await idbAll('residents');
      for(const r of rs){
        const antes = (r.filtros||[]).length;
        r.filtros = (r.filtros||[]).filter(f => norm(f.nome) !== norm(nome));
        if(r.filtros.length !== antes) await putRes(r);
      }
      toast('Filtro excluído');
      modalAjustar();
    }));
    $('#aj-criar').addEventListener('click', async () => {
      const v = sanitizarTexto($('#aj-novo').value, 60);
      if(!v){ toast('Digite um nome'); return; }
      const defs2 = await idbAll('filterDefs');
      if(defs2.some(d => norm(d.nome) === norm(v))){ toast('Já existe'); return; }
      await idbPut('filterDefs', {nome:v, periodicidade:6});
      toast('Filtro criado');
      modalAjustar();
    });
  })();
}

/* ---- REINICIAR FILTROS (mantém os importados) ---- */
function modalReiniciar(){
  (async () => {
    if(!(await modalConfirmar('Reiniciar filtros?', 'Todos os filtros personalizados serão removidos dos moradores. Os filtros importados das planilhas são mantidos.', 'REINICIAR'))) return;
    if(!(await modalConfirmar('Confirmação final', 'Tem certeza? Esta ação não pode ser desfeita.', 'SIM, REINICIAR'))) return;
    const rs = await idbAll('residents');
    let n = 0;
    for(const r of rs){
      const antes = (r.filtros||[]).length;
      r.filtros = (r.filtros||[]).filter(f => f.origem === 'importado');
      if(r.filtros.length !== antes){ await putRes(r); n++; }
    }
    toast('Filtros personalizados removidos ('+n+' moradores afetados)');
    closeModal();
  })();
}

async function filtrarGuias(){
  const hoje = todayISO();
  let guias = await idbAll('guides');
  const fSit = [...GUI.filt].filter(k => k === 'comigo' || k === 'entregue');
  const fDat = [...GUI.filt].filter(k => k === 'passou' || k === 'porvir');
  if(fSit.length) guias = guias.filter(g => fSit.includes(g.situacao));
  if(fDat.length) guias = guias.filter(g => {
    if(!g.data) return false;
    const passou = g.data < hoje;
    return (passou && fDat.includes('passou')) || (!passou && fDat.includes('porvir'));
  });
  return guias.sort((a,b) => (a.data||'9999').localeCompare(b.data||'9999'));
}

function modalGuiaConferir(atualizar){
  (async () => {
    const guias = (await idbAll('guides')).filter(g => g.situacao === 'comigo')
      .sort((a,b) => (a.data||'9999').localeCompare(b.data||'9999'));

        '<button class="btn btn-sm btn-g" id="gc-ent" disabled>🤝 ENTREGUE</button>' +

        '<button class="btn btn-sm" id="gc-aus" disabled>🚪 AUSENTE</button>' +

      '</div>' +

      '<div class="row-list" id="gc-lista">' +
        (guias.length ? guias.map(g2 =>
          '<label class="res-item" data-id="'+g2.id+'"><input type="checkbox"><span style="flex:1"><b>'+esc(g2.nome)+'</b><br><span class="tiny muted">'+esc(g2.exame||'')+' · '+fmtDate(g2.data)+'</span></span></label>').join('')
          : '<p class="muted small">Nenhuma guia marcada como 🫵 COMIGO.</p>') +
      '</div>');
    aplicarDataInput($('#gc-data'));
    bindModalVoltar(closeModal);
    const dataInp = $('#gc-data');
    const bot = () => { $('#gc-ent').disabled = $('#gc-aus').disabled = $('#gc-dev').disabled = sel.size === 0; };
    $$('#gc-lista .res-item').forEach(item => item.addEventListener('click', () => {
      setTimeout(() => {
        const c = item.querySelector('input');
        item.classList.toggle('on', c.checked);
        if(c.checked) sel.add(+item.dataset.id); else sel.delete(+item.dataset.id);
        bot();
      }, 0);
    }));
    const getDataISO = () => {
      const br = dataInp.value;
      const iso = dataBRtoISO(br);
      return iso || todayISO();
    };
    $('#gc-ent').addEventListener('click', async () => {
      for(const id of sel){
        const g2 = guias.find(x => x.id === id);
        g2.situacao = 'entregue';
        g2.entregueData = getDataISO();
        await idbPut('guides', g2);
      }
      closeModal(); toast(sel.size+' guia(s) marcada(s) como ENTREGUE'); atualizar();

    $('#gc-dev').addEventListener('click', async () => {
      for(const id of sel){
        const g2 = guias.find(x => x.id === id);
        g2.situacao = 'devolvido';
        g2.entregueData = getDataISO();
        await idbPut('guides', g2);
      }
      closeModal(); toast(sel.size+' guia(s) marcada(s) como DEVOLVIDO'); atualizar();
    });
    $('#gc-aus').addEventListener('click', async () => {
      for(const id of sel){
        const g2 = guias.find(x => x.id === id);
        g2.tentativas = g2.tentativas || [];
        g2.tentativas.push(getDataISO());
        await idbPut('guides', g2);
      }
      closeModal(); toast('Tentativa registrada para '+sel.size+' guia(s)'); atualizar();
    });
  })();
}

/* ================= TELA DE VISITA DOMICILIAR ================= */
const VIS = { sel:new Set(), marks:{}, data:'' };
registerScreen('visitas', async (app, p) => {
  VIS.sel = new Set(); VIS.marks = {};
  // Se recebeu rid (botão REGISTRAR VISITA do Avisos), abre diretamente na residência desse morador
  const ridAuto = (p && p.rid) ? +p.rid : null;
  app.innerHTML = topbarHTML({titulo:'VISITA DOMICILIAR', esq:{}}) +
    '<div class="content">' +
      '<div class="visit-row">' +
        '<button class="btn btn-sm btn-g" id="vs-ok">➡️🏠 Visita realizada</button>' +
        '<button class="btn btn-sm btn-y" id="vs-nao">🚪🔒 Visita não realizada</button>' +
      '</div>' +
      '<div class="visit-row">' +
        '<button class="btn btn-sm" id="vs-rel">📋 Gerar relatório</button>' +
        '<button class="btn btn-sm btn-p" id="vs-salvar" disabled>💾 Salvar</button>' +
      '</div>' +
      '<div class="visit-row-3">' +
        '<label class="fld" for="vs-data" style="margin:0">Data das visitas</label>' +
        '<button class="btn btn-sm" id="vs-limpar">❌ Limpar</button>' +
      '</div>' +
      '<input class="inp" id="vs-data" value="'+(VIS.data ? dataISOtoBR(VIS.data) : '')+'" inputmode="numeric" pattern="[0-9/]*" placeholder="dd/mm/aaaa">' +
      '<div class="search-box mt"><input id="vs-q" placeholder="Buscar rua ou número…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">' +
        '<button class="clear-x" id="vs-x" style="display:none">❌</button></div>' +
      '<p class="tiny muted mt">Toque nas residências para selecionar (ficam azuis). Verde = visita realizada, amarelo = não realizada.</p>' +
      '<p class="tiny muted">Ícones: ✅ visita recente · 🚺 gestante vencida · 🚼 puericultura vencida · ‼️ várias pessoas vencidas · ❗ uma pessoa vencida · 📖 cadastro incompleto.</p>' +
      '<div id="vs-lista" class="row-list"></div>' +
    '</div>';
  $('#tb-voltar').addEventListener('click', navBack);
  aplicarDataInput($('#vs-data'));
  let casas = [];
  let rsCache = [];
  (async () => {
    rsCache = await idbAll('residents');
    await refreshFilterDefsCache();
    const m = new Map();
    for(const r of rsCache){
      const rua = stripTipoLogradouro(r.endereco||''), num = numeroExibicao(r.numero);
      if(!rua || !num) continue;
      const k = norm(rua) + '|' + numCasa(r.numero);
      if(!m.has(k)) m.set(k, {rua, num, moradores: []});
      m.get(k).moradores.push(r);
    }
    casas = [...m.values()].sort((a,b) => a.rua.localeCompare(b.rua,'pt-BR') || a.num.localeCompare(b.num,'pt-BR',{numeric:true}));
    if(ridAuto){
      const alvo = rsCache.find(r => r.id === ridAuto);
      if(alvo){
        const k = norm(stripTipoLogradouro(alvo.endereco||'')) + '|' + numCasa(alvo.numero);
        VIS.sel.add(k);
        setTimeout(() => { const row = $('#vs-lista [data-k="'+(window.CSS && CSS.escape ? CSS.escape(k) : k)+'"]'); if(row) row.scrollIntoView({block:'center', behavior:'smooth'}); }, 200);
      }
    }
    renderLista();
  })();
  const q = $('#vs-q'), xBt = $('#vs-x');
  const filtro = () => {
    const v = norm(q.value.trim());
    xBt.style.display = v ? 'block' : 'none';
    if(!v) return casas;
    const dig = q.value.replace(/\D/g,'');
    const digN = dig ? String(parseInt(dig,10)) : ''; // "0285" procura a casa 285
    return casas.filter(c => norm(c.rua).includes(v) || (digN && numCasa(c.num).includes(digN)));
  };
  // Calcula ícones de status para uma casa (sem visita hoje/últimos 30)
  function iconesCasa(casa){
    const hoje = todayISO();
    const hojeD = new Date(hoje + 'T00:00:00');
    const lim30 = new Date(hojeD); lim30.setDate(lim30.getDate() - 30);
    const limISO = lim30.toISOString().substr(0,10);
    let temVisitaRecente = false;
    let temGestanteVencida = false;
    let temPuericulturaVencida = false;
    let nPessoasVencidasOutras = 0;
    let temIncompleto = false;
    for(const r of casa.moradores){
      // Cadastro incompleto?
      if(!r.cadastro || !r.cpf || !r.cns || !r.mae || !r.nascimento || !r.endereco || !r.numero) temIncompleto = true;
      // Visitas recentes?
      const visitas = (r.visitas||[]).map(v => v.data).filter(Boolean).sort();
      const ultima = visitas.length ? visitas[visitas.length-1] : null;
      if(ultima && ultima >= limISO && ultima <= hoje){ temVisitaRecente = true; continue; }
      // Sem visita recente: verifica filtros vencidos
      if(r.cond && r.cond.gestante) temGestanteVencida = true;
      const idade = idadeEm(r.nascimento);
      if(idade != null && idade < 2) temPuericulturaVencida = true;
      // Outros filtros vencidos (exclui gestante/puericultura que têm ícone próprio)
      if(moradorTemFiltroVencido(r) && !(r.cond && r.cond.gestante) && !(idade != null && idade < 2)){
        nPessoasVencidasOutras++;
      }
    }
    // Hierarquia: ✅ > 🚼 > 🚺 > ‼️/❗
    let icon = '';
    if(temVisitaRecente) icon = '✅';
    else if(temPuericulturaVencida) icon = '🚼';
    else if(temGestanteVencida) icon = '🚺';
    else if(nPessoasVencidasOutras > 1) icon = '‼️';
    else if(nPessoasVencidasOutras === 1) icon = '❗';
    // 📖 cadastro incompleto (à esquerda do ícone de visita)
    return { icon, book: temIncompleto ? '📖' : '' };
  }
  function renderLista(){
    const div = $('#vs-lista');
    const lista = filtro();
    const temMarca = Object.keys(VIS.marks).length > 0;
    const dataBR = $('#vs-data').value;
    const dataISO = dataBRtoISO(dataBR);
    $('#vs-salvar').disabled = !(temMarca && dataISO);
    div.innerHTML = lista.length ? lista.map(c => {
      const k = norm(c.rua) + '|' + c.num;
      const mk = VIS.marks[k];
      const { icon, book } = iconesCasa(c);
      return '<div class="p-row '+(mk==='ok'?'visit-ok':mk==='nao'?'visit-nao':'')+(VIS.sel.has(k)?' sel-azul':'')+'" data-k="'+esc(k)+'">' +
        '<span class="p-nome">'+esc(c.rua+', '+c.num)+'</span>' +
        '<span class="visit-icons">' +
          (book ? '<span class="vi vi-book">'+book+'</span>' : '') +
          (icon ? '<span class="vi vi-visit">'+icon+'</span>' : '') +
        '</span>' +
        (mk ? '<span class="p-badges"><span class="st-tag '+(mk==='ok'?'st-entregue':'st-avisado')+'">'+(mk==='ok'?'✔ visita realizada':'🚪 não realizada')+'</span></span>' : '') +
      '</div>';
    }).join('') : '<p class="small muted center">Nenhuma residência encontrada'+(q.value?' para a busca':'')+'.</p>';
    div.querySelectorAll('.p-row').forEach(row => row.addEventListener('click', () => {
      const k = row.dataset.k;
      if(VIS.sel.has(k)) VIS.sel.delete(k); else VIS.sel.add(k);
      row.classList.toggle('sel-azul');
    }));
  }
  q.addEventListener('input', debounce(renderLista, 200));
  xBt.addEventListener('click', () => { q.value=''; xBt.style.display='none'; renderLista(); });
  $('#vs-data').addEventListener('change', () => { VIS.data = dataBRtoISO($('#vs-data').value); $('#vs-salvar').disabled = !(Object.keys(VIS.marks).length && VIS.data); });
  $('#vs-ok').addEventListener('click', () => {
    if(!VIS.sel.size){ toast('Selecione uma ou mais residências'); return; }
    for(const k of VIS.sel) VIS.marks[k] = 'ok';
    VIS.sel.clear(); renderLista();
  });
  $('#vs-nao').addEventListener('click', () => {
    if(!VIS.sel.size){ toast('Selecione uma ou mais residências'); return; }
    for(const k of VIS.sel) VIS.marks[k] = 'nao';
    VIS.sel.clear(); renderLista();
  });
  $('#vs-limpar').addEventListener('click', () => { VIS.sel.clear(); VIS.marks = {}; renderLista(); toast('Seleções e marcações apagadas'); });
  $('#vs-rel').addEventListener('click', () => modalVisitaRelatorio());
  $('#vs-salvar').addEventListener('click', async () => {
    const dataBRv = $('#vs-data').value;
    const data = dataBRtoISO(dataBRv);
    if(!Object.keys(VIS.marks).length){ toast('Marque ao menos uma residência'); return; }
    if(!data){ toast('Informe uma data válida para as visitas'); return; }
    const rs = await idbAll('residents');
    const porCasa = {};
    for(const r of rs){
      const k = norm(stripTipoLogradouro(r.endereco||'')) + '|' + numCasa(r.numero);
      if(VIS.marks[k]) (porCasa[k] = porCasa[k] || []).push(r);
    }
    let n = 0;
    for(const k in porCasa){
      for(const r of porCasa[k]){
        r.visitas = r.visitas || [];
        const status = VIS.marks[k] === 'ok' ? 'realizada' : 'nao';
        r.visitas.push({data, status});
        await putRes(r);
        // Persistência local: salva no store `visits` vinculado por IDs únicos + endereço
        await visitaLocalSalvar(r, data, status);
        n++;
      }
    }
    VIS.marks = {}; VIS.sel.clear();
    renderLista();
    toast('Visitas registradas para '+n+' morador(es)');
  });
  async function coletarListas(){
    const rs = await idbAll('residents');
    const ok = [], nao = [];
    for(const r of rs){
      const k = norm(stripTipoLogradouro(r.endereco||'')) + '|' + numCasa(r.numero);
      if(VIS.marks[k] === 'ok') ok.push(r);
      else if(VIS.marks[k] === 'nao') nao.push(r);
    }
    const linhaTxt = r => (r.cns || '—') + '\t' + (r.nome||'').toUpperCase() + '\t' + linhaEndereco(r);
    return { ok, nao, txt:
      'Visitas realizadas:\n' + ok.map(linhaTxt).join('\n') +
      (nao.length ? '\n\nVisitas não realizadas:\n' + nao.map(linhaTxt).join('\n') : '') };
  }
  function modalVisitaRelatorio(){
    (async () => {
      const { ok, nao, txt } = await coletarListas();
      if(!ok.length && !nao.length){ toast('Marque residências primeiro'); return; }
      openModal(
        modalTop('RELATÓRIO DE VISITAS') +
        '<p style="margin:.3rem 0 .7rem">'+
          (ok.length ? ok.length+' moradores encontrados para visitas realizadas' : '') +
          (ok.length && nao.length ? ' e ' : '') +
          (nao.length ? nao.length+' moradores encontrados para visitas não realizadas' : '') +
        '</p>' +
        '<div style="display:flex;gap:.5rem;margin-bottom:.7rem">' +
          '<button class="btn btn-sm btn-p" id="vr-copiar">Copiar tudo</button>' +
          '<button class="btn btn-sm" id="vr-imprimir">Imprimir</button>' +
        '</div>' +
        '<div class="card" style="white-space:pre-wrap;font-size:.85rem;font-family:monospace">'+esc(txt)+'</div>');
      bindModalVoltar(closeModal);
      $('#vr-copiar').addEventListener('click', () => copiarTexto(txt));
      $('#vr-imprimir').addEventListener('click', () => {
        const tab = lista => '<table><tr><th>CNS</th><th>Nome completo</th><th>Endereço</th></tr>' +
          lista.map(r => '<tr><td>'+esc(r.cns||'—')+'</td><td>'+esc(r.nome||'')+'</td><td>'+esc(linhaEndereco(r))+'</td></tr>').join('') + '</table>';
        imprimirHTML('Relatório de visitas domiciliares',
          (ok.length ? '<h2>Visitas realizadas</h2>' + tab(ok) : '') +
          (nao.length ? '<h2>Visitas não realizadas</h2>' + tab(nao) : ''));
      });
    })();
  }
});

/*
  Estatísticas da área com impressão de listas (🖨️):
   👥 moradores / com cadastro completo  → lista alfabética de moradores
   🏡 residências / média de moradores   → lista de residências (logradouro+número único, zeros à esquerda ignorados)

   📄 guias entregues / comigo           → lista de guias entregues
   📅 agendamentos entregues             → lista de consultas com aviso entregue
   🚪 visitas domiciliares realizadas    → lista das visitas realizadas
   🤰 gestantes / bebês (<2 anos)        → listas das gestantes e das crianças
*/

      const k = chaveRes(r);
      if(!m.has(k)) m.set(k, {k, rua, num: numeroExibicao(r.numero), m:[]});
      m.get(k).m.push(r);
    }
    return [...m.values()].sort((a,b) => a.rua.localeCompare(b.rua,'pt-BR') || a.num.localeCompare(b.num,'pt-BR',{numeric:true}));
  })();
  const cadastroCompleto = r => onlyDigits(r.cadastro) && onlyDigits(r.cpf) && onlyDigits(r.cns) &&
    norm(r.mae) && r.nascimento && norm(r.endereco) && String(r.numero||'').trim();
  const morCmpl = rs.filter(cadastroCompleto).length;
  const media = casas.length ? (rs.length / casas.length) : 0;
  const contagem = {};
  rs.forEach(r => filtrosDoMorador(r).forEach(n => contagem[norm(n)] = (contagem[norm(n)]||0)+1));
  const defsEmUso = defs.filter(d => (contagem[norm(d.nome)]||0) > 0);
  const gEnt = guias.filter(g => g.situacao === 'entregue').length;
  const gCom = guias.filter(g => g.situacao === 'comigo').length;
  const agEnt = ags.filter(a => ['pessoalmente','naCasa','whatsapp'].includes(a.notificadoVia)).length;
  let visOk = 0;
  rs.forEach(r => (r.visitas||[]).forEach(v => { if(v.status === 'realizada') visOk++; }));
  const gestantes = rs.filter(r => r.cond && r.cond.gestante).sort((a,b) => String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
  const bebes = rs.filter(r => { const i = idadeEm(r.nascimento); return i != null && i < 2; })
    .sort((a,b) => (b.nascimento||'').localeCompare(a.nascimento||''));

  function imprimirResidencias(){

function importarPapelArquivo(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1600;
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ toast('Não foi possível ler a imagem'); return; }
      const fator = Math.min(1, MAX / Math.max(w, h));
      w = Math.max(1, Math.round(w * fator)); h = Math.max(1, Math.round(h * fator));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let data = '';
      try{ data = cv.toDataURL('image/webp', .85); }catch(e){}
      if(!data || data.indexOf('data:image/webp') !== 0) data = cv.toDataURL('image/jpeg', .85);
      // Um novo envio sobrescreve o anterior; a imagem importada NÃO é apagada
      // quando o usuário troca para outro tema — só um novo envio a substitui.
      S.tema.papelCustom = { img: data, modo: (S.tema.papelCustom && S.tema.papelCustom.modo) || 'vertical' };
      S.tema.papel = { tipo:'custom' };
      salvarEstado().then(() => {
        applyTheme();
        render('tema', {});
        toast('Fundo importado — toque na moldura para ajustar');
      });
    };
    img.onerror = () => toast('Arquivo de imagem inválido');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

async function setupSW(){
  // Registra o service worker (cache + checagem de versão). Só ativa em http(s).
  // No Capacitor, location.protocol é 'https:' quando empacotado como PWA hosted.
  try{
    if('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')){
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      navigator.serviceWorker.addEventListener('message', (ev) => {
        if(ev.data && ev.data.type === 'atualizacao-disponivel'){
          mostrarBannerAtualizacao(ev.data.version, ev.data.notes);
        }
      });
      // Verifica atualização quando o usuário volta a focar o app
      const checkUpdate = () => {
        try{ if(reg.active) reg.active.postMessage('check-update'); }catch(e){}
      };
      document.addEventListener('visibilitychange', () => { if(!document.hidden) checkUpdate(); });
      window.addEventListener('focus', checkUpdate);
      setTimeout(checkUpdate, 800); // checa ao abrir
    }
  }catch(e){}
}

/* ---------------- Auto-exclusão 180 dias (etiquetas, guias, agendamentos, visitas órfãos) ----------------
   Itens locais sem vínculo a morador (ou cujo morador foi excluído) ficam salvos até
   180 dias após a data de registro; depois são apagados automaticamente. Se forem
   re-vinculados a um morador (re-aplicados), o contador de órfão é zerado. */
const AUTO_DEL_DIAS = 180;
function diasEntre(a, b){
  const d1 = new Date(a), d2 = new Date(b);
  return Math.floor((d2 - d1) / 86400000);
}
async function limparOrfaos180(){
  const hoje = todayISO();
  // Etiquetas (tags) órfãs: t.moradorId não bate com nenhum morador atual
  const rs = await idbAll('residents');
  const idsValidos = new Set(rs.map(r => r.id));
  const tags = await idbAll('tags');
  for(const t of tags){
    if(!t.keys || !t.keys.length){
      // tag sem chaves únicas — se vínculo moradorId sumiu, conta órfão desde registro
      if(!t.moradorId || !idsValidos.has(t.moradorId)){
        if(t.orfaDesde && diasEntre(t.orfaDesde, hoje) >= AUTO_DEL_DIAS) await idbDel('tags', t.id);
      }
    } else {
      // tem chaves: se algum morador bate, está vinculada; senão, está órfã
      const matched = await buscarMoradoresPorIdsUnicos(t.keys);
      if(matched.length === 0){
        if(!t.orfaDesde){ t.orfaDesde = hoje; await idbPut('tags', t); }
        else if(diasEntre(t.orfaDesde, hoje) >= AUTO_DEL_DIAS) await idbDel('tags', t.id);
      } else {
        if(t.orfaDesde){ t.orfaDesde = null; await idbPut('tags', t); }
      }
    }
  }
  // Guias: se cadastro+nome não bater, é órfão; conta 180 dias
  const guias = await idbAll('guides');
  for(const g of guias){
    if(g.registradoEm && diasEntre(g.registradoEm, hoje) >= AUTO_DEL_DIAS){
      // só apaga se realmente órfão (sem morador correspondente)
      const ids = [];
      if(g.cadastro) ids.push({k:'cadastro', v:String(g.cadastro).trim()});
      const matched = ids.length ? await buscarMoradoresPorIdsUnicos(ids) : [];
      if(matched.length === 0) await idbDel('guides', g.id);
    }
  }
  // Agendamentos: idem
  const ags = await idbAll('appointments');
  for(const a of ags){
    if(a.registradoEm && diasEntre(a.registradoEm, hoje) >= AUTO_DEL_DIAS){
      const ids = [];
      if(a.cadastro) ids.push({k:'cadastro', v:String(a.cadastro).trim()});
      const matched = ids.length ? await buscarMoradoresPorIdsUnicos(ids) : [];
      if(matched.length === 0) await idbDel('appointments', a.id);
    }
  }
  // Visitas: store próprio (visits). Mesma regra: se não bater morador nem endereço, órfão.
  const visitas = await idbAll('visits');
  for(const v of visitas){
    if(v.registradoEm && diasEntre(v.registradoEm, hoje) >= AUTO_DEL_DIAS){
      const ids = [];
      if(v.cadastro) ids.push({k:'cadastro', v:String(v.cadastro).trim()});
      if(v.cpf) ids.push({k:'cpf', v:String(v.cpf).replace(/\D/g,'')});
      if(v.cns) ids.push({k:'cns', v:String(v.cns).replace(/\D/g,'')});
      const matched = ids.length ? await buscarMoradoresPorIdsUnicos(ids) : [];
      if(matched.length === 0) await idbDel('visits', v.id);
    }
  }
}

/* ---------------- Persistência de etiquetas locais (tags) ----------------
   Quando o usuário marca um filtro em um morador, gravamos também no store `tags`
   vinculado pelos IDs únicos (cartão cidadão / CPF / CNS). Se o banco de moradores
   for apagado e re-importado, re-aplicamos as etiquetas por esses IDs. */
async function tagLocalSalvar(r, nomeFiltro, validade, periodicidade, desde){
  const ids = idsUnicosMorador(r);
  if(!ids.length) return;
  const tags = await idbAll('tags');
  // Se já existe uma tag com esse nome+IDs (mesmo conjunto), atualiza
  const chave = nomeFiltro.toLowerCase() + '|' + ids.map(x => x.k+':'+x.v).sort().join('|');
  const existente = tags.find(t => (t.nome||'').toLowerCase() + '|' + (t.keys||[]).map(x => x.k+':'+x.v).sort().join('|') === chave);
  if(existente){
    existente.validade = validade || null;
    existente.periodicidade = periodicidade || null;
    existente.desde = desde || todayISO();
    existente.moradorId = r.id;
    existente.orfaDesde = null;
    await idbPut('tags', existente);
  } else {
    await idbPut('tags', {
      nome: nomeFiltro,
      keys: ids,
      moradorId: r.id,
      validade: validade || null,
      periodicidade: periodicidade || null,
      desde: desde || todayISO(),
      registradoEm: todayISO(),
      orfaDesde: null
    });
  }
}
async function tagLocalRemover(r, nomeFiltro){
  const ids = idsUnicosMorador(r);
  if(!ids.length) return;
  const tags = await idbAll('tags');
  for(const t of tags){
    if((t.nome||'').toLowerCase() === (nomeFiltro||'').toLowerCase()){
      // confere se o conjunto de IDs bate
      const tkeys = (t.keys||[]).map(x => x.k+':'+x.v).sort().join('|');
      const rkeys = ids.map(x => x.k+':'+x.v).sort().join('|');
      if(tkeys === rkeys) await idbDel('tags', t.id);
    }
  }
}
async function reaplicarTagsLocais(){
  const tags = await idbAll('tags');
  const rs = await idbAll('residents');
  for(const t of tags){
    const matched = await buscarMoradoresPorIdsUnicos(t.keys || []);
    for(const r of matched){
      r.filtros = r.filtros || [];
      const existe = (r.filtros||[]).find(f => (f.nome||'').toLowerCase() === (t.nome||'').toLowerCase());
      if(!existe){
        r.filtros.push({
          nome: t.nome,
          origem: 'aplicado',
          desde: t.desde || todayISO(),
          validade: t.validade || null,
          periodicidade: t.periodicidade || null
        });
        await putRes(r);
        // atualiza vínculo
        t.moradorId = r.id; t.orfaDesde = null;
        await idbPut('tags', t);
      }
    }
  }
}

/* ---------------- Persistência de visitas domiciliares (visits) ----------------
   Quando o usuário registra uma visita em um endereço, salvamos também no store
   `visits` vinculado por IDs únicos (cartão cidadão / CPF / CNS) + endereço
   (rua + número). Se o banco for reimportado, re-aplicamos às visitas a moradores
   com mesmo ID único ou mesmo endereço. */
async function visitaLocalSalvar(r, dataISO, status){
  const ids = idsUnicosMorador(r);
  const rua = norm(stripTipoLogradouro(r.endereco||''));
  const num = numCasa(r.numero);
  const obj = {
    cadastro: ids.find(x => x.k === 'cadastro')?.v || '',
    cpf: ids.find(x => x.k === 'cpf')?.v || '',
    cns: ids.find(x => x.k === 'cns')?.v || '',
    rua, num,
    data: dataISO,
    status: status === 'realizada' ? 'realizada' : 'nao',
    nome: r.nome || '',
    registradoEm: todayISO()
  };
  await idbPut('visits', obj);
}
async function reaplicarVisitasLocais(){
  const visitas = await idbAll('visits');
  const rs = await idbAll('residents');
  let n = 0;
  for(const v of visitas){
    const ids = [];
    if(v.cadastro) ids.push({k:'cadastro', v:String(v.cadastro).trim()});
    if(v.cpf) ids.push({k:'cpf', v:String(v.cpf).replace(/\D/g,'')});
    if(v.cns) ids.push({k:'cns', v:String(v.cns).replace(/\D/g,'')});
    let matched = ids.length ? await buscarMoradoresPorIdsUnicos(ids) : [];
    // Se não achou por IDs, tenta por endereço (mesma rua + número)
    if(matched.length === 0 && v.rua && v.num){
      matched = rs.filter(r => {
        const rr = norm(stripTipoLogradouro(r.endereco||''));
        const nn = numCasa(r.numero);
        return rr === v.rua && nn === v.num;
      });
    }
    for(const r of matched){
      r.visitas = r.visitas || [];
      // Evita duplicar: se já existe visita igual (data+status), não adiciona
      const jaTem = (r.visitas||[]).some(x => x.data === v.data && x.status === v.status);
      if(!jaTem){
        r.visitas.push({data: v.data, status: v.status});
        await putRes(r);
        n++;
      }
    }
  }
  return n;
}

/* ---------------- Exportar produção local ---------------- */
function nomeArquivoExportacao(){
  // ACS-Digital-dd-mm-aa-NomeSemAcentoSemEspaco.json
  const hoje = new Date();
  const dd = String(hoje.getDate()).padStart(2,'0');
  const mm = String(hoje.getMonth()+1).padStart(2,'0');
  const aa = String(hoje.getFullYear()).substr(2,2);
  let nome = String(S.nome || 'usuario')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // tira acentos
    .replace(/[^A-Za-z0-9]/g,'');                    // tira espaços e símbolos
  if(!nome) nome = 'usuario';
  return 'ACS-Digital-'+dd+'-'+mm+'-'+aa+'-'+nome+'.json';
}
function baixarArquivo(filename, conteudo, mime){
  const blob = new Blob([conteudo], {type: mime || 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
}

/* ---------------- Importar JSON exportado ---------------- */
async function importarJSON(file){
  try{
    const txt = await lerArquivoTexto(file);
    const data = JSON.parse(txt);
    if(!data || data.app !== 'ACS Digital') throw new Error('Arquivo não é uma exportação do ACS Digital');
    showLoading('Importando produção local…', file.name);
    await yieldUI();
    // Re-aplica cada categoria (não substitui — soma)
    let nTags = 0, nVisitas = 0, nGuias = 0, nAgs = 0, nArea = 0;
    if(Array.isArray(data.tags)){
      for(const t of data.tags){ delete t.id; await idbPut('tags', t); nTags++; }
    }
    if(Array.isArray(data.visitas)){
      for(const v of data.visitas){ delete v.id; await idbPut('visits', v); nVisitas++; }
    }
    if(Array.isArray(data.guias)){
      for(const g of data.guias){ if(g.id != null) delete g.id; await idbPut('guides', g); nGuias++; }
    }
    if(Array.isArray(data.agendamentos)){
      for(const a of data.agendamentos){ if(a.id != null) delete a.id; await idbPut('appointments', a); nAgs++; }
    }
    if(Array.isArray(data.area) && data.area.length){
      // Área: substitui (vem do usuário, é a definição atual dele)
      await idbClr('area');
      for(const c of data.area){ if(c.id != null) delete c.id; await idbPut('area', c); nArea++; }
      S.areaDefinida = true;
      await salvarEstado();
    }
    if(Array.isArray(data.filterDefs)){
      for(const d of data.filterDefs) await idbPut('filterDefs', d);
    }
    hideLoading();
    // Re-aplica etiquetas e visitas aos moradores atuais
    await reaplicarTagsLocais();
    await reaplicarVisitasLocais();
    toast('Importação concluída: ' + (nTags+nVisitas+nGuias+nAgs+nArea) + ' registros');
    return { areaDefinida: nArea > 0 };
  }catch(e){
    hideLoading();
    toast('Erro ao importar JSON: ' + (e && e.message));
    return null;
  }
}

/* ---------------- Calendário (eventos) ---------------- */
async function getEventosCalendario(){
  const hoje = todayISO();
  const hojeD = new Date(hoje + 'T00:00:00');
  const rs = await idbAll('residents');
  const guias = await idbAll('guides');
  const ags = await idbAll('appointments');
  const eventos = []; // {dataISO, tipo, ...}

  // 1) Aniversários
  for(const r of rs){
    if(!r.nascimento) continue;
    const m = r.nascimento.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m) continue;
    const mesDia = m[2] + '-' + m[3];
    let anoAtual = hojeD.getFullYear();
    let dataEv = new Date(anoAtual + '-' + mesDia + 'T00:00:00');
    if(dataEv < hojeD) dataEv = new Date((anoAtual+1) + '-' + mesDia + 'T00:00:00');
    eventos.push({
      dataISO: dataEv.toISOString().substr(0,10),
      tipo: 'aniversario',
      nome: r.nome || '',
      moradorId: r.id,
      cadastro: r.cadastro || ''
    });
  }

  // 2) Guias de exame
  for(const g of guias){
    if(!g.data) continue;
    eventos.push({
      dataISO: g.data,
      tipo: 'guia',
      situacao: g.situacao || 'comigo',
      nome: g.nome || '',
      cadastro: g.cadastro || '',
      guiaId: g.id
    });
  }

  // 3) Agendamentos
  for(const a of ags){
    if(!a.data) continue;
    eventos.push({
      dataISO: a.data,
      tipo: 'agendamento',
      via: a.notificadoVia || '',
      nome: a.nome || '',
      cadastro: a.cadastro || '',
      agId: a.id
    });
  }

  return eventos;
}

function statusGuiaLabel(s){
  if(s === 'entregue') return '🤝 ENTREGUE';
  if(s === 'comigo') return '🫵 COMIGO';
  if(s === 'devolvido') return '↩️ DEVOLVIDO';
  return '?';
}
function statusAgLabel(v){
  if(v === 'pessoalmente') return '🤝 ENTREGUE';
  if(v === 'naCasa') return '🏠 ENTREGUE';
  if(v === 'whatsapp') return '📱 AVISADO';
  if(v === 'ausente') return '🚪 NÃO ENTREGUE';
  return '?';
}

const CAL = { periodo: 'prox30' };
registerScreen('calendario', async (app) => {

    '<div class="content">' +
      '<div class="cal-toolbar">' +
        '<button class="btn '+(CAL.periodo==='ult30'?'btn-p':'')+'" id="cal-ult">ÚLTIMOS 30</button>' +
        '<button class="btn '+(CAL.periodo==='hoje'?'btn-p':'')+'" id="cal-hoje">HOJE</button>' +
        '<button class="btn '+(CAL.periodo==='prox30'?'btn-p':'')+'" id="cal-prox">PRÓXIMOS 30</button>' +

      '<div id="cal-corpo"></div>' +

  $('#cal-hoje').addEventListener('click', () => { CAL.periodo = 'hoje'; renderCal(); });
  $('#cal-prox').addEventListener('click', () => { CAL.periodo = 'prox30'; renderCal(); });
  function renderCal(){
    (async () => {
      const evs = await getEventosCalendario();
      const hoje = todayISO();
      const hojeD = new Date(hoje + 'T00:00:00');
      // Filtra por período
      let filtrados;
      if(CAL.periodo === 'hoje'){
        filtrados = evs.filter(e => e.dataISO === hoje);
      } else if(CAL.periodo === 'ult30'){
        const lim = new Date(hojeD); lim.setDate(lim.getDate() - 30);
        filtrados = evs.filter(e => {
          const d = new Date(e.dataISO + 'T00:00:00');
          return d < hojeD && d >= lim;
        });
        // Ordena: dia anterior mais próximo primeiro (do mais novo para o mais antigo)
        filtrados.sort((a,b) => b.dataISO.localeCompare(a.dataISO));
      } else { // prox30
        const lim = new Date(hojeD); lim.setDate(lim.getDate() + 30);
        filtrados = evs.filter(e => {
          const d = new Date(e.dataISO + 'T00:00:00');
          return d > hojeD && d <= lim;
        });
        // Ordena: do mais próximo ao mais distante
        filtrados.sort((a,b) => a.dataISO.localeCompare(b.dataISO));
      }
      const corpo = $('#cal-corpo');
      if(!filtrados.length){
        corpo.innerHTML = '<div class="card cal-empty">' +
          (CAL.periodo === 'ult30' ? 'Não há eventos registrados nos últimos 30 dias.' :
           CAL.periodo === 'hoje' ? 'Não há eventos para hoje.' :
           'Não há eventos para os próximos 30 dias.') + '</div>';
        return;
      }
      // Agrupa por data
      const porData = {};
      for(const e of filtrados){
        if(!porData[e.dataISO]) porData[e.dataISO] = [];
        porData[e.dataISO].push(e);
      }
      const datas = Object.keys(porData).sort((a,b) => {
        if(CAL.periodo === 'ult30') return b.localeCompare(a);
        return a.localeCompare(b);
      });
      // Renderiza
      const rs = await idbAll('residents');
      const findMoradorByCadastro = (cad) => rs.find(r => String(r.cadastro||'').trim() === String(cad||'').trim());
      const findMoradorById = (id) => rs.find(r => r.id === id);
      corpo.innerHTML = datas.map(dataISO => {
        const [_, mm, dd] = dataISO.match(/^(\d{4})-(\d{2})-(\d{2})/);
        const evs2 = porData[dataISO];
        return '<div class="cal-day">' +
          '<div class="cal-data">' +
            '<span class="cal-dia">'+parseInt(dd,10)+'</span>' +
            '<span class="cal-mes">'+parseInt(mm,10)+'</span>' +
          '</div>' +
          evs2.map(e => {
            if(e.tipo === 'aniversario'){
              const m = e.moradorId ? findMoradorById(e.moradorId) : null;
              if(m){
                return '<div class="cal-evento">' +
                  '<button class="mini-btn" data-cal-per="'+m.id+'">🎂 '+esc(e.nome)+'</button>' +
                '</div>';
              } else {
                return '<div class="cal-evento"><span class="cal-nome-bolo">🎂 '+esc(e.nome)+'</span></div>';
              }
            }
            if(e.tipo === 'guia'){
              const m = e.cadastro ? findMoradorByCadastro(e.cadastro) : null;
              const perfilBtn = m ? '<button class="mini-btn" data-cal-per="'+m.id+'">👤 '+esc(e.cadastro)+'</button>'
                                  : (e.cadastro ? '<span class="cal-nome-bolo">👤 '+esc(e.cadastro)+'</span>'
                                                : '<span class="cal-nome-bolo">👤 sem cadastro</span>');
              const guiaBtn = '<button class="mini-btn" data-cal-guia="'+e.guiaId+'">📄 '+statusGuiaLabel(e.situacao)+'</button>';
              const nomeSpan = e.nome ? '<span class="cal-nome-bolo">'+esc(e.nome)+'</span>' : '';
              return '<div class="cal-evento">'+perfilBtn+guiaBtn+nomeSpan+'</div>';
            }
            if(e.tipo === 'agendamento'){
              const m = e.cadastro ? findMoradorByCadastro(e.cadastro) : null;
              const perfilBtn = m ? '<button class="mini-btn" data-cal-per="'+m.id+'">👤 '+esc(e.cadastro)+'</button>'
                                  : (e.cadastro ? '<span class="cal-nome-bolo">👤 '+esc(e.cadastro)+'</span>'
                                                : '<span class="cal-nome-bolo">👤 sem cadastro</span>');
              const agBtn = '<button class="mini-btn" data-cal-ag="'+e.agId+'">🗓️ '+statusAgLabel(e.via)+'</button>';
              const nomeSpan = e.nome ? '<span class="cal-nome-bolo">'+esc(e.nome)+'</span>' : '';
              return '<div class="cal-evento">'+perfilBtn+agBtn+nomeSpan+'</div>';
            }
            return '';
          }).join('') +
        '</div>';
      }).join('');
      // Bindings
      corpo.querySelectorAll('[data-cal-per]').forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation(); go('perfil', {id:+b.dataset.calPer});
      }));
      corpo.querySelectorAll('[data-cal-guia]').forEach(b => b.addEventListener('click', async (e) => {
        e.stopPropagation();
        const g = (await idbAll('guides')).find(x => x.id === +b.dataset.calGuia);
        if(g) modalGuiaForm(g);
      }));
      corpo.querySelectorAll('[data-cal-ag]').forEach(b => b.addEventListener('click', async (e) => {
        e.stopPropagation();
        const a = (await idbAll('appointments')).find(x => x.id === +b.dataset.calAg);
        if(a) modalAgForm(a);
      }));
    })();
  }
  renderCal();
});

/* ---------------- Morador: tem evento no calendário? ---------------- */
async function moradorTemEventoCalendario(r){
  if(!r.cadastro) return false;
  const evs = await getEventosCalendario();
  const hoje = todayISO();
  const hojeD = new Date(hoje + 'T00:00:00');
  const lim = new Date(hojeD); lim.setDate(lim.getDate() + 30);
  return evs.some(e => {
    if(e.dataISO < hoje || e.dataISO > lim.toISOString().substr(0,10)) return false;
    if(e.tipo === 'aniversario') return e.moradorId === r.id;
    if(e.tipo === 'guia' || e.tipo === 'agendamento') return String(e.cadastro||'').trim() === String(r.cadastro||'').trim();
    return false;
  });
}

    }
  }catch(e){
    // Fallback: history-based (já tratado pelo popstate do navegador no WebView do Capacitor)
  }
}

/* ---------------- Inicialização ---------------- */
(async function boot(){
  try{
    await idb();
    await carregarEstado();
    await migrarEnderecos();
    await reaplicarTagsLocais();
    await reaplicarVisitasLocais();
    await limparOrfaos180();
    applyTheme();
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    buildManifest();
    setupSW();
    setupCapacitorBackButton();
    resetStack('nome', {}, true);
    iniciarRelogio();
    if(new URLSearchParams(location.search).has('seed')){
      await seedDemo();
      banner('Dados de demonstração carregados (?seed=1)');
      await irPosDesbloqueio();
      return;
    }
    if(isPrimeiroDiaTrimestre() && S.usadaTri !== trimestreStr()){
      setTimeout(() => banner(
        senhaObrigatoria() ? 'A senha deste trimestre expirou. Informe a nova senha de ativação.'
                           : 'Novo trimestre iniciado ('+trimestreStr()+'). A senha sazonal foi redefinida.'), 700);
    }
  }catch(e){
    document.body.innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#900">Erro ao iniciar o ACS Digital: ' + esc(e && e.message) + '</div>';
  }
})();
</script>
